# Nextest configuration. The `ci` profile is selected explicitly in
# .github/workflows/ci.yml via `--profile ci`; local runs keep nextest
# defaults (see CLAUDE.md for the local --test-threads guidance).

[profile.ci]
# Integration tests are IO-bound, not CPU-bound: each test clones a template
# database (CREATE DATABASE … TEMPLATE), boots an in-process API server, and
# talks to it over loopback HTTP — most wall time is spent waiting on
# Postgres and the network stack, and ~26 tests sleep for multiple seconds.
# Oversubscribing the runner's 4 vCPUs roughly halves shard wall time.
# CI raises Postgres max_connections to 500 to give the extra concurrent
# pools headroom (see the "Tune Postgres" step in ci.yml).
test-threads = 10

# One retry guards the merge queue against timing flakes surfaced by the
# higher parallelism. Nextest still reports retried tests loudly as FLAKY in
# the run summary, so genuine flakes stay visible rather than hidden.
retries = 1

# Surface tests that creep past a minute so slow-test regressions are
# visible in the log instead of silently inflating shard times.
slow-timeout = { period = "60s" }
