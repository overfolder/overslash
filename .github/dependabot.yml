version: 2
updates:
  # Rust (Cargo) — Workspace
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      cargo-deps:
        patterns: ["*"]

  # npm (Dashboard)
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      dashboard-deps:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (the native port) breaks the dashboard build — stay on 6.x.
      - dependency-name: "typescript"
        versions: ["7.x"]

  # npm (SDK) — @overslash/sdk. Dev-only dependency tree (vitest, tsup, vite),
  # but it still ships a published package, so keep it on the same cadence as
  # the dashboard rather than letting the toolchain drift.
  - package-ecosystem: "npm"
    directory: "/sdk"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      sdk-deps:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (the native port) drops the JS compiler API that tsup's
      # .d.ts generation (rollup-plugin-dts) builds on, so `npm run build`
      # dies before emitting types — stay on 6.x.
      - dependency-name: "typescript"
        versions: ["7.x"]

  # GitHub Actions — pinned to full commit SHAs (see DECISIONS D31); Dependabot
  # maintains SHA + version comment, and cooldown gates every bump like cargo/npm.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      github-actions-deps:
        patterns: ["*"]
