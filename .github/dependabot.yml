version: 2
updates:
  # Rust (Cargo) — Workspace
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 10
    # TLS/PKI crates skip the cooldown (D135): trust-root changes (CA
    # additions and distrusts) and cert-validation fixes often ship without a
    # scored advisory. Almost all of them are transitive, and the default
    # `allow` is direct-only, so they need the `dependency-type: "all"` entries
    # to be updated at all. Keep the patterns identical in `allow`,
    # `cooldown.exclude` and the `pki` group.
    allow:
      - dependency-type: "direct"
      - dependency-name: "rustls*"
        dependency-type: "all"
      - dependency-name: "webpki*"
        dependency-type: "all"
      - dependency-name: "tokio-rustls"
        dependency-type: "all"
      - dependency-name: "hyper-rustls"
        dependency-type: "all"
      - dependency-name: "ring"
        dependency-type: "all"
      - dependency-name: "aws-lc-*"
        dependency-type: "all"
      - dependency-name: "openssl*"
        dependency-type: "all"
      - dependency-name: "native-tls"
        dependency-type: "all"
      - dependency-name: "tokio-native-tls"
        dependency-type: "all"
      - dependency-name: "hyper-tls"
        dependency-type: "all"
      - dependency-name: "jsonwebtoken"
        dependency-type: "all"
      - dependency-name: "pem*"
        dependency-type: "all"
      - dependency-name: "der"
        dependency-type: "all"
      - dependency-name: "spki"
        dependency-type: "all"
      - dependency-name: "pkcs*"
        dependency-type: "all"
      - dependency-name: "sec1"
        dependency-type: "all"
      - dependency-name: "simple_asn1"
        dependency-type: "all"
    cooldown:
      default-days: 7
      exclude:
        - "rustls*"
        - "webpki*"
        - "tokio-rustls"
        - "hyper-rustls"
        - "ring"
        - "aws-lc-*"
        - "openssl*"
        - "native-tls"
        - "tokio-native-tls"
        - "hyper-tls"
        - "jsonwebtoken"
        - "pem*"
        - "der"
        - "spki"
        - "pkcs*"
        - "sec1"
        - "simple_asn1"
    groups:
      # Listed first: a dependency joins the first group it matches, so PKI
      # bumps get their own PR instead of riding in the weekly bundle.
      pki:
        patterns: ["rustls*", "webpki*", "tokio-rustls", "hyper-rustls", "ring", "aws-lc-*", "openssl*", "native-tls", "tokio-native-tls", "hyper-tls", "jsonwebtoken", "pem*", "der", "spki", "pkcs*", "sec1", "simple_asn1"]
      cargo-deps:
        patterns: ["*"]

  # npm (Dashboard)
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      dashboard-deps:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (the native port) breaks the dashboard build — stay on 6.x.
      - dependency-name: "typescript"
        versions: ["7.x"]

  # npm (SDK) — @overslash/sdk. Dev-only dependency tree (vitest, tsup, vite),
  # but it still ships a published package, so keep it on the same cadence as
  # the dashboard rather than letting the toolchain drift.
  - package-ecosystem: "npm"
    directory: "/sdk"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      sdk-deps:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (the native port) drops the JS compiler API that tsup's
      # .d.ts generation (rollup-plugin-dts) builds on, so `npm run build`
      # dies before emitting types — stay on 6.x.
      - dependency-name: "typescript"
        versions: ["7.x"]

  # GitHub Actions — pinned to full commit SHAs (see DECISIONS D31); Dependabot
  # maintains SHA + version comment, and cooldown gates every bump like cargo/npm.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      github-actions-deps:
        patterns: ["*"]
