version: 2
updates:
  # Rust (Cargo) — Workspace
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      cargo-deps:
        patterns: ["*"]

  # npm (Dashboard)
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      dashboard-deps:
        patterns: ["*"]

  # GitHub Actions — pinned to full commit SHAs (see DECISIONS D31); Dependabot
  # maintains SHA + version comment, and cooldown gates every bump like cargo/npm.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      github-actions-deps:
        patterns: ["*"]
