name: overslash

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: overslash
      POSTGRES_PASSWORD: overslash
      POSTGRES_DB: overslash
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U overslash
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: crates/overslash-api/Dockerfile.dev
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://overslash:overslash@postgres:5432/overslash
      HOST: 0.0.0.0
      RUSTUP_TOOLCHAIN: stable
      SQLX_OFFLINE: "true"
      # The dashboard dev server runs on a separate port (5173, or a dynamic
      # port in worktrees). Without this the API's redirect builder falls back
      # to public_url (:3000) for org switches / deep-links, sending the browser
      # to the API instead of the Vite dev server. Mirror DASH_HOST_PORT so
      # redirects land on the dashboard, which proxies /v1 + /auth back here.
      DASHBOARD_URL: http://localhost:${DASH_HOST_PORT:-5173}
      # Live Map (/map) and the per-call `action.*` events it animates. On for
      # the local stack, off everywhere but dev — it costs one durable `events`
      # row per action call (D57).
      OVERSLASH_LIVE_MAP: "1"
    ports:
      # Loopback publish for host access (browser/curl on the host).
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    networks:
      # `default` keeps API↔postgres/dashboard wiring inside this project.
      default: {}
      # `overfolder-shared` lets the Overfolder backend reach this API
      # container-to-container via the `overslash` alias (no host hop).
      overfolder-shared:
        aliases:
          - overslash
    volumes:
      - ../crates/overslash-core/src:/app/crates/overslash-core/src:ro
      - ../crates/overslash-db/src:/app/crates/overslash-db/src:ro
      - ../crates/overslash-api/src:/app/crates/overslash-api/src:ro
      - ../crates/overslash-mcp/src:/app/crates/overslash-mcp/src:ro
      - ../crates/overslash-cli/src:/app/crates/overslash-cli/src:ro
      # overslash-metrics is a (non-dev) dependency of overslash-api and has no
      # explicit [lib], so cargo needs its src/lib.rs to even parse the manifest.
      - ../crates/overslash-metrics/src:/app/crates/overslash-metrics/src:ro
      - ../tests/mock-target/src:/app/tests/mock-target/src:ro
      - ../services:/app/services:ro
      # Compile-time assets pulled in via include_str! from outside src/:
      #   overslash-core   -> templates/email/*.html
      #   overslash-api    -> CARGO_MANIFEST_DIR/../../SKILL.md == /app/SKILL.md
      - ../crates/overslash-core/templates:/app/crates/overslash-core/templates:ro
      - ../SKILL.md:/app/SKILL.md:ro
      - cargo-cache:/usr/local/cargo/registry
      # Persist the build dir across container recreation. `make dev` does
      # `down` + `up --build`, which without this resets target/ to the image
      # state (prebuilt deps + stub-compiled overslash crates) every time,
      # forcing a full recompile on every start. Docker seeds a fresh named
      # volume from the image's /app/target on first creation, so deps stay
      # cached and only changed crates rebuild. Note: dependency bumps
      # (Cargo.lock) won't reach an existing volume — run `make worktree-clean`
      # (or remove the api-target volume) after a deps change.
      - api-target:/app/target
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile.dev
    environment:
      API_URL: http://api:3000
    ports:
      - "127.0.0.1:${DASH_HOST_PORT:-5173}:5173"
    volumes:
      - ../dashboard:/app
      - dashboard-node-modules:/app/node_modules
      # static/SKILL.md is a symlink to the repo-root SKILL.md (../../SKILL.md).
      # Only ../dashboard is mounted, so that target resolves to /SKILL.md inside
      # the container — mount the real file there so the symlink isn't dangling
      # (otherwise svelte-kit sync's statSync throws ENOENT walking static/).
      - ../SKILL.md:/SKILL.md:ro
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

  # ── Mail stack (e2e only) ────────────────────────────────────────────
  #
  # A real mailbox, reached through the real gateway. `services/email.yaml`
  # targets overfwd, a REST→IMAP/SMTP gateway; pointing it at a hand-written
  # HTTP fake would prove only that we can echo JSON back to ourselves. These
  # two give the e2e suite an actual IMAP conversation to assert on.
  #
  # Both carry the `mail` profile, but don't rely on it alone: podman-compose
  # 1.0.6 has no `--profile` flag and ignores the key. Every other target names
  # its services explicitly, so a bare `make local` never starts these;
  # `scripts/e2e-up.sh` (via `make mail-up`) does.
  greenmail:
    profiles: ["mail"]
    image: greenmail/standalone:2.1.11
    environment:
      # Appended to the image's own GREENMAIL_OPTS (which already sets
      # setup.test.all, hostname=0.0.0.0 and auth.disabled), so the stock
      # port layout stays: smtp 3025, imap 3143, REST api 8080.
      #
      # `users.login=email` makes the full address the login. Without it the
      # login is the local part only (`e2e`), which would then be a username
      # with no `@` — and a login with no domain is exactly the case overfwd's
      # autoconfig cannot resolve.
      GREENMAIL_ADDITIONAL_OPTS: >-
        -Dgreenmail.users=e2e:e2epass@example.com
        -Dgreenmail.users.login=email
    ports:
      - "127.0.0.1:${GREENMAIL_API_PORT:-38080}:8080"
      - "127.0.0.1:${GREENMAIL_SMTP_PORT:-33025}:3025"
    healthcheck:
      # The image ships no curl/wget/nc — only bash. /dev/tcp is the one
      # in-container probe available.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /api/service/readiness HTTP/1.0\\r\\n\\r\\n' >&3; head -1 <&3 | grep -q '200 OK'"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  overfwd:
    profiles: ["mail"]
    # Pinned, not `:latest`. e2e-up.sh hard-fails the whole bring-up when the
    # mail stack doesn't start, so an upstream push to a mutable tag would
    # break every e2e run, not just the email story.
    # 0.4.0 is the first release where an unparseable IMAP SEARCH key fails
    # loudly instead of coming back as `200 []`. The e2e mail story asserts
    # that behaviour, so the pin is a floor, not just a stability choice.
    image: angelmanuel/overfwd:0.4.0
    environment:
      OVERFWD_BIND: 0.0.0.0:8000
      # Keyless: exercises the template's `optional` gateway scheme, where the
      # Authorization header is omitted rather than failing on a missing
      # secret. The e2e suite still stores a gateway key to prove the org-vault
      # path works; overfwd simply doesn't require it.
      OVERFWD_REQUIRE_API_KEY: "false"
      # Autoconfig does live ISPDB/DNS lookups that can't resolve a container
      # hostname. Off means a missing endpoint header fails loudly as
      # `bad_request` instead of silently reaching for the public internet
      # from inside a test run.
      OVERFWD_AUTOCONFIG_ENABLE: "false"
    ports:
      - "127.0.0.1:${OVERFWD_PORT:-38000}:8000"
    depends_on:
      greenmail:
        condition: service_healthy

volumes:
  pgdata:
  cargo-cache:
  api-target:
  dashboard-node-modules:

networks:
  default: {}
  # Cross-project bridge to Overfolder. Created by `make local`/`make dev`
  # (and Overfolder's `make local`); external so neither project owns it.
  overfolder-shared:
    external: true
