# Local Metabase for exploring the Metabase MCP server / designing a service spec.
# One shared instance on the host; Claude MCP config points every worktree at it.
#   podman-compose -p overslash-metabase -f docker/metabase/docker-compose.yml up -d
# App metadata lives in a dedicated Postgres so the instance survives restarts and
# never touches the Overslash dev database.
#
# Format 2.4 (not 3.x): the local docker-compose shim is Python 1.29.2, which
# supports healthchecks + `depends_on: condition:` only under the 2.x schema.
version: "2.4"

services:
  metabase-db:
    image: docker.io/library/postgres:16-alpine
    container_name: overslash-metabase-db
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
      POSTGRES_DB: metabase
    volumes:
      - metabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  metabase:
    image: docker.io/metabase/metabase:latest
    container_name: overslash-metabase
    depends_on:
      metabase-db:
        condition: service_healthy
    ports:
      # Host 3033 -> container 3000 (3000 is taken by the dashboard dev server).
      - "3033:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      MB_DB_HOST: metabase-db
      MB_ENABLE_EMBEDDING: "false"
    # Health is polled from the host in bootstrap.sh (the image has no curl/wget
    # guaranteed, so a container-level healthcheck would give false negatives).
    restart: unless-stopped

volumes:
  metabase-db-data:
