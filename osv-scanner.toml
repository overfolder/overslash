# osv-scanner configuration — CASA 6.1.1. CI runs the scanner over every
# lockfile in the repo (Cargo.lock, dashboard/ and sdk/ package-lock.json) in
# the `osv-scan` job of .github/workflows/deps-audit.yml.
#
# Ignores follow docs/compliance/casa/dependency-vulnerability-policy.md: a
# reason saying why the advisory does not apply, and an `ignoreUntil` no more
# than 90 days out. Past that date the entry stops suppressing and the scan
# fails again, forcing a re-triage.
#
# Keep in step with the `[advisories].ignore` list in deny.toml — the same
# RustSec advisories surface through both scanners. The full justification
# lives there; these reasons are the one-line version.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
ignoreUntil = 2026-12-22
reason = "rsa (Marvin) needs a private RSA key; jsonwebtoken is used with HS256 only, no RSA key is ever loaded. No upstream fix. See deny.toml."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
ignoreUntil = 2026-12-22
reason = "paste is unmaintained, not vulnerable; build-time proc-macro via fastembed. No maintained release. See deny.toml."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0449"
ignoreUntil = 2026-12-22
reason = "unsafe-libyaml is unmaintained, not vulnerable; template parsing via serde_yaml. No maintained release; fix is migrating off serde_yaml. See deny.toml."

# happy-dom 21.0.3, sdk/ dev dependency (vitest's DOM environment). The only
# fixed release, 21.0.4, was published 2026-10-20, inside D30's 7-day
# cooldown, and the advisory is High, not Critical. On review: bump
# sdk/package.json to ^21.0.4 and delete this entry.
[[IgnoredVulns]]
id = "GHSA-834v-8h66-3h79"
ignoreUntil = 2026-10-27
reason = "happy-dom ESM import-alias injection needs attacker-written <script type=module>; sdk/ tests render only our own components, and happy-dom never ships. Fix 21.0.4 is from 2026-10-20, inside the D30 cooldown."
