openapi: 3.1.0
info:
  title: Resend
  key: resend
  category: Communication
servers:
  - url: https://api.resend.com
components:
  securitySchemes:
    token:
      type: apiKey
      in: header
      name: Authorization
      x-overslash-prefix: "Bearer "
      default_secret_name: resend_key
paths:
  /domains:
    get:
      operationId: list_domains
      summary: List verified sending domains
      risk: read
  /emails:
    post:
      operationId: send_email
      summary: "Send email '{subject}' to {to}"
      risk: write
      disclose:
        # The Resend API accepts `to` as a string or an array of strings;
        # join arrays so the summary reads as addresses, not raw JSON.
        - label: To
          filter: '.body.to | if type == "array" then join(", ") else . end'
        - label: From
          filter: .body.from
        - label: Subject
          primary: true
          filter: .body.subject
        - label: Body (HTML)
          primary: true
          filter: .body.html // empty
          max_chars: 2000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, subject]
              properties:
                from:
                  type: string
                  description: Sender email address
                to:
                  type: string
                  description: Recipient email address
                subject:
                  type: string
                  description: Email subject line
                html:
                  type: string
                  description: HTML body content
