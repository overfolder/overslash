openapi: 3.1.0
info:
  title: Stripe
  key: stripe
  category: Payments
servers:
  - url: https://api.stripe.com
components:
  securitySchemes:
    token:
      type: apiKey
      in: header
      name: Authorization
      x-overslash-template:
        lang: jq
        expr: '"Bearer " + .token'
      default_secret_name: stripe_key
paths:
  /v1/charges:
    get:
      operationId: list_charges
      # No `pagination:` block, deliberately. Stripe's continuation is
      # `starting_after=<id of the last object on this page>`, which lives at
      # an array-indexed position in the body, and the dotted-path grammar
      # takes no indices on purpose. So the gateway cannot compute the next
      # call — but a caller can, which is why `starting_after` is declared.
      summary: List recent charges
      risk: read
      test:
        params:
          limit: 1
      description: >-
        One page of charges, newest first, bounded by `limit` (default 10, max
        100). The response carries `has_more`; to read the next page pass
        `starting_after` set to the `id` of the last charge in this one.
      parameters:
        - name: limit
          in: query
          description: Number of charges to return (max 100)
          schema:
            type: integer
            default: 10
        - name: starting_after
          in: query
          description: >-
            Cursor for the next page: the `id` of the last object in the page
            you just read. Stripe's list responses carry `has_more`, so keep
            going while it is true.
          schema:
            type: string
    post:
      operationId: create_charge
      summary: "Create charge for {amount} {currency}"
      risk: write
      disclose:
        - label: Amount (smallest currency unit)
          primary: true
          filter: .body.amount
        - label: Currency
          primary: true
          filter: .body.currency
      # The payment source token is a credential-like value; keep it out of
      # the persisted raw payload.
      redact:
        - body.source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount:
                  type: integer
                  description: Amount in cents
                currency:
                  type: string
                  description: Three-letter ISO currency code
                source:
                  type: string
                  description: Payment source token
  /v1/customers:
    get:
      operationId: list_customers
      # Same shape as list_charges, and the same reason for no block. `limit`
      # is declared here for the first time: before it, this action read every
      # customer in the account into one response.
      summary: List customers
      risk: read
      description: >-
        One page of customers, newest first, bounded by `limit` (default 10,
        max 100). The response carries `has_more`; to read the next page pass
        `starting_after` set to the `id` of the last customer in this one.
      parameters:
        - name: limit
          in: query
          description: Number of customers to return (max 100)
          schema:
            type: integer
            default: 10
        - name: starting_after
          in: query
          description: >-
            Cursor for the next page: the `id` of the last object in the page
            you just read. Stripe's list responses carry `has_more`, so keep
            going while it is true.
          schema:
            type: string
