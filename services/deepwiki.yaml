openapi: 3.1.0
info:
  title: DeepWiki
  key: deepwiki
  category: Documentation
  description: >
    DeepWiki exposes documentation search and Q&A over public GitHub
    repositories as an MCP server. No authentication required. Used as a
    reference example of an external-MCP-runtime service in Overslash.
x-overslash-runtime: mcp
servers: []
paths: {}
x-overslash-mcp:
  url: https://mcp.deepwiki.com/mcp
  auth:
    kind: none
  # The tool list below is authored; run `POST /v1/services/{id}/mcp/resync`
  # against an instance of this template to populate that instance's
  # discovered_tools with the live tools/list response, which is then overlaid
  # on top of these entries at read time.
  autodiscover: true
  tools:
    - name: read_wiki_structure
      risk: read
      scope_param: repoName
      description: "List the table of contents for {repoName}'s wiki"
      input_schema:
        type: object
        properties:
          repoName:
            type: string
            description: "owner/repo slug (e.g. `vercel/next.js`)"
        required: [repoName]
    - name: read_wiki_contents
      risk: read
      scope_param: repoName
      # No `pagination:` block: this is one large document, not a collection,
      # and DeepWiki offers no page size or cursor to bound it with. The
      # bounded ways in are the two siblings named in the description.
      description: >-
        Read the full wiki for {repoName}. This returns the whole wiki in one
        response and DeepWiki offers no way to ask for less, so on a large
        repository it can exceed the response size cap. Prefer
        read_wiki_structure for the table of contents, or ask_question for a
        specific answer; reach for this only when you genuinely need the
        whole text.
      input_schema:
        type: object
        properties:
          repoName:
            type: string
            description: "owner/repo slug"
        required: [repoName]
    - name: ask_question
      risk: read
      scope_param: repoName
      description: "Ask a natural-language {question} about {repoName}"
      input_schema:
        type: object
        properties:
          repoName:
            type: string
            description: "owner/repo slug"
          question:
            type: string
            description: "Natural-language question"
        required: [repoName, question]
