# WhatsApp via a self-hosted whatsapp-mcp-docker container
# (https://github.com/angel-manuel/whatsapp-mcp-docker).
#
# The tool list below is authored inline (globals ship their tools in-repo)
# and mirrors the catalog the container serves as of v0.7.0 (2026-08-14,
# verified against tools/list and internal/tools/register.go). `ping` is
# served but deliberately not exposed: cache_sync_status is the richer
# diagnostic and is gated the same way. When a new container release lands,
# re-run tools/list and re-sync this file — the drift guard in
# crates/overslash-api/tests/whatsapp.rs pins the names known here.
#
# Bytes never ride an MCP tool call in either direction. Media moves over
# plain HTTP on the container's own port, behind the same bearer token as
# /mcp: `GET /media/<sha256>` out and `POST /media` in. Both halves are
# wrapped here — `download_media`'s `download` block turns the outbound
# reference into a capability URL, and `upload_media`'s `upload` block mints
# one for the inbound push — so an agent can move files in either direction
# without the bytes ever entering its context, and without ever being handed
# the container's URL or its AUTH_TOKEN.
openapi: 3.1.0
info:
  title: WhatsApp
  key: whatsapp
  category: Communication
  description: >
    Send and read WhatsApp messages via a self-hosted whatsapp-mcp-docker
    container (https://github.com/angel-manuel/whatsapp-mcp-docker), which
    bundles `whatsmeow` and exposes its tools over Streamable HTTP MCP
    with mandatory bearer auth. Each container holds one WhatsApp session
    (one paired phone number); operators run one container per
    end-user/account.
x-overslash-runtime: mcp
servers: []
paths: {}
x-overslash-mcp:
  # url and secret_name are not set here — operators must provide both when
  # creating a service instance from this template:
  #   url        — the hosted whatsapp-mcp-docker endpoint (e.g. http://host:8081/mcp)
  #   secret_name — vault key that holds the container's AUTH_TOKEN bearer token
  auth:
    kind: bearer
  # Tools are authored inline (globals ship their tool list in-repo).
  # `autodiscover: true` lets `POST /v1/services/{id}/mcp/resync` populate the
  # *instance's* `discovered_tools` from a live tools/list; those are overlaid
  # on top of these entries at read time (authored fields win).
  autodiscover: true
  tools:
    # ── pairing (mutate session state; exempt from `not_paired` gate) ──
    - name: pairing_start
      risk: write
      description: "Open a WhatsApp pair flow and return the first event (rotating QR payload, plus a phone-link code if {phone} is given)"
      # Both args are optional; a bare pairing_start legitimately shows an
      # empty summary (zero-output filters omit their field).
      disclose:
        - label: Phone
          filter: .arguments.phone // empty
        - label: Device name
          filter: .arguments.device_name // empty
      input_schema:
        type: object
        properties:
          phone:
            type: string
            description: "Optional E.164 phone number (digits only, no `+`). When set, returns a phone-link code in addition to the QR."
          device_name:
            type: string
            description: "Label shown on the paired phone; defaults to `WHATSAPP_DEVICE_NAME` env or `whatsapp-mcp`."
        required: []

    - name: pairing_complete
      risk: write
      description: "Poll the in-progress pair flow; blocks up to {wait_seconds} for a terminal event"
      disclose:
        - label: Wait seconds
          filter: .arguments.wait_seconds // empty
      input_schema:
        type: object
        properties:
          wait_seconds:
            type: integer
            minimum: 0
            maximum: 120
            default: 60
            description: "Max seconds to wait. 0 = return the latest cached event without blocking."
        required: []

    # ── messaging ──
    - name: send_message
      risk: write
      scope_param: recipient
      description: 'Send WhatsApp message "{text}" to {recipient}[, quoting {reply_to_id}]'
      input_schema:
        type: object
        properties:
          recipient:
            type: string
            description: "Destination chat: a JID (`user@s.whatsapp.net` or `group@g.us`) or a raw phone number with country code (digits only)."
            # A privacy LID (`239135323373760@lid`) names a person only to
            # WhatsApp — its digits are not a phone number, so no local
            # formatting can make it reviewable. `resolve_jid` is the one
            # read tool that answers for every value this param accepts, so
            # the approval reads "Sonia Pérez (+34600111222)" and the
            # permission key collapses onto the phone number instead of
            # minting a separate rule per address the same human answers at.
            resolve:
              tool: resolve_jid
              args:
                jid: '{recipient}'
              display: '{name}[ ({phone})]'
              scope: phone
          text:
            type: string
            minLength: 1
            description: "Message body. Must be non-empty."
          reply_to_id:
            type: string
            description: "Optional stanza id of the message to quote-reply to."
        required: [recipient, text]
      # MCP-runtime disclosure projection is {runtime, tool, arguments,
      # resolved, service, action} (see compute_approval_detail in
      # routes/actions/approval_detail.rs), so filters address `.arguments.*`
      # rather than the HTTP `.params.*` / `.body.*` shape used by Mode A/C
      # HTTP actions.
      disclose:
        # `.resolved.*` carries the resolver output; fall back to the literal
        # argument whenever the container could not answer, so a lookup
        # failure degrades this row rather than blanking it.
        - label: "Recipient"
          filter: ".resolved.recipient // .arguments.recipient"
        - label: "JID"
          filter: ".arguments.recipient"
        - label: "Message"
          primary: true
          filter: ".arguments.text"
        - label: "Reply to"
          filter: ".arguments.reply_to_id // empty"

    - name: send_reaction
      risk: write
      scope_param: chat_jid
      description: >-
        React to a message in {chat_jid} with an emoji. An EMPTY emoji removes
        your existing reaction and a new one replaces it — WhatsApp allows one
        reaction per person per message, so this is set-or-clear, not append.
        The target message's author is resolved from the local cache; pass
        sender_jid when the message is not cached (and your own JID for a
        message you sent). Newsletter/channel messages are rejected: reacting
        there needs a server id the cache does not capture.
      input_schema:
        type: object
        properties:
          chat_jid:
            type: string
            description: "Chat containing the message: a JID (`user@s.whatsapp.net` or `group@g.us`) or a raw phone number with country code (digits only)."
            # Same reasoning as send_message.recipient: a reaction is visible
            # to everyone in the chat, so the approval has to name the human
            # rather than an unreadable @lid, and the permission key should
            # collapse onto the phone number.
            resolve:
              tool: resolve_jid
              args:
                jid: '{chat_jid}'
              display: '{name}[ ({phone})]'
              scope: phone
          message_id:
            type: string
            minLength: 1
            description: "Stanza id of the message to react to, as returned by get_conversation / list_messages."
          emoji:
            type: string
            description: "Emoji to react with. An empty string removes your existing reaction."
          sender_jid:
            type: string
            description: "Author of the target message. Only needed when that message is not in the local cache; otherwise it is looked up."
        required: [chat_jid, message_id, emoji]
      disclose:
        - label: "Chat"
          filter: ".resolved.chat_jid // .arguments.chat_jid"
        - label: "JID"
          filter: ".arguments.chat_jid"
        - label: "Emoji"
          primary: true
          filter: ".arguments.emoji"
        - label: "Message"
          filter: ".arguments.message_id"

    # ── polls ─────────────────────────────────────────────────────────
    # A poll's standings are OBSERVED, never queried: WhatsApp offers no way
    # to ask the server for a tally, so the container accumulates vote events
    # as they arrive and get_poll_results reports what this device saw. Votes
    # cast before pairing, or while the container was down, are simply gone —
    # the same "empty can mean not-yet-synced" trap the cache reads carry,
    # except here no cache_sync can repair it.
    - name: send_poll
      risk: write
      scope_param: recipient
      description: >-
        Create a poll in {recipient} asking "{question}". Returns the poll's
        message_id, which is the handle vote_poll and get_poll_results take.
        Option texts are identified on the wire by a hash of the text, so two
        identical options are indistinguishable once votes come back — the
        container rejects duplicates rather than letting the tally be
        ambiguous.
      input_schema:
        type: object
        properties:
          recipient:
            type: string
            description: "Destination chat: a JID (`user@s.whatsapp.net` or `group@g.us`) or a raw phone number with country code (digits only)."
            resolve:
              tool: resolve_jid
              args:
                jid: '{recipient}'
              display: '{name}[ ({phone})]'
              scope: phone
          question:
            type: string
            minLength: 1
            description: "The poll question."
          options:
            type: array
            items:
              type: string
              minLength: 1
            minItems: 2
            maxItems: 12
            description: "Answer options, in display order. Must be unique."
          selectable_count:
            type: integer
            minimum: 0
            maximum: 12
            description: "How many options one voter may pick. Default 1 (single choice); 0 means no limit. Must not exceed the number of options."
        required: [recipient, question, options]
      disclose:
        - label: "Recipient"
          filter: ".resolved.recipient // .arguments.recipient"
        - label: "JID"
          filter: ".arguments.recipient"
        - label: "Question"
          primary: true
          filter: ".arguments.question"
        - label: "Options"
          filter: '.arguments.options | join(" / ")'
        - label: "Picks allowed"
          filter: '.arguments // {} | if has("selectable_count") then .selectable_count else empty end'

    - name: vote_poll
      risk: write
      scope_param: chat_jid
      description: >-
        Cast (or withdraw) this device's vote on the poll {message_id} in
        {chat_jid}. Option texts must match the ballot exactly; an empty
        options array withdraws a previous vote. Only polls this device
        actually received can be voted on — a poll created before pairing is
        not votable, and no sync recovers it.
      input_schema:
        type: object
        properties:
          chat_jid:
            type: string
            description: "JID of the chat holding the poll (e.g. `34600111222@s.whatsapp.net` or `1234567890-1600000000@g.us`)."
            resolve:
              tool: resolve_jid
              args:
                jid: '{chat_jid}'
              display: '{name}[ ({phone})]'
              scope: phone
          message_id:
            type: string
            description: "Stanza id of the poll creation message, as returned by send_poll or by list_messages / get_message_context (kind `poll`)."
          options:
            type: array
            items:
              type: string
            maxItems: 12
            description: "Option texts to vote for, exactly as they appear on the ballot. Empty array withdraws."
        required: [chat_jid, message_id, options]
      disclose:
        - label: "Chat"
          filter: ".resolved.chat_jid // .arguments.chat_jid"
        - label: "JID"
          filter: ".arguments.chat_jid"
        - label: "Vote"
          primary: true
          filter: '.arguments.options | if length == 0 then "withdraw vote" else join(" / ") end'
        - label: "Poll"
          filter: ".arguments.message_id"

    - name: get_poll_results
      risk: read
      scope_param: chat_jid
      description: >-
        Read the tally of the poll {message_id} in {chat_jid}: per-option vote
        counts and voters. Answered from the local cache, which accumulates
        vote events as they arrive. WhatsApp offers no way to query a poll's
        standings, so votes cast before this device was linked, or while the
        container was down, are NOT counted and cannot be recovered by
        cache_sync. Treat the numbers as "what this device observed".
      input_schema:
        type: object
        properties:
          chat_jid:
            type: string
            description: "JID of the chat holding the poll."
          message_id:
            type: string
            description: "Stanza id of the poll creation message, as returned by send_poll or by list_messages / get_message_context (kind `poll`)."
        required: [chat_jid, message_id]

    # ── contacts ──
    - name: search_contacts
      risk: read
      description: "Search cached contacts by substring {query} across name, push name, business name, nickname, and phone"
      input_schema:
        type: object
        properties:
          query:
            type: string
            description: "Case-insensitive substring."
          limit:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          page:
            type: integer
            minimum: 0
            default: 0
        required: [query]

    - name: list_all_contacts
      risk: read
      description: "List all cached contacts, paginated, in display-name order"
      input_schema:
        type: object
        properties:
          limit:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          page:
            type: integer
            minimum: 0
            default: 0
        required: []

    - name: get_contact_details
      risk: read
      scope_param: jid
      description: >-
        Fetch full details for the contact at {jid} — cache + live USync:
        `name` (display-name cascade), `phone`, push/business/full/first name,
        nickname, status, profile picture, is_on_whatsapp. Resolves a @lid
        through the alias map first, so a privacy LID finds the cached
        contact; `phone` is empty rather than wrong when the real number is
        unknown. For just the readable identity — including groups and
        newsletters, which this tool does not cover — prefer resolve_jid.
      input_schema:
        type: object
        properties:
          jid:
            type: string
            minLength: 1
            description: "WhatsApp JID (e.g. `1234567890@s.whatsapp.net`)."
        required: [jid]

    - name: resolve_jid
      risk: read
      scope_param: jid
      description: >-
        Resolve {jid} — any address send_message accepts: phone JID, privacy
        @lid, group, newsletter, or a bare phone number — to a readable
        identity: `name` (display-name cascade), `phone` (E.164), and
        `canonical_jid` (the phone JID when one is known). Follows the
        lid↔phone alias map, so a @lid never reports its own digits as a
        phone number; when the alias has not been observed yet, `phone` comes
        back empty rather than wrong. `kind` is user|group|newsletter|unknown.
        A JID nothing is known about answers with empty fields, not an error.
        Cache-first and cheap — this is also what the gateway calls to render
        a send approval, so a reviewer sees "Sonia Pérez (+34600111222)"
        instead of "239135323373760@lid".
        Keywords: who is this, whose number, identify, phone number, contact
        name, resolve lid, translate jid.
      input_schema:
        type: object
        properties:
          jid:
            type: string
            minLength: 1
            description: "Any address `send_message` accepts: `user@s.whatsapp.net`, `...@lid`, `group@g.us`, a newsletter JID, or digits."
        required: [jid]

    - name: get_group_info
      risk: read
      scope_param: group_jid
      description: "Fetch authoritative group metadata for {group_jid} (name, topic, participants, flags)"
      input_schema:
        type: object
        properties:
          group_jid:
            type: string
            minLength: 1
            description: "Group JID (must end in `@g.us`)."
        required: [group_jid]

    # ── conversations (PREFERRED read surface) ──
    # These two merge a contact's linked phone JID (…@s.whatsapp.net) and
    # privacy LID (…@lid) automatically, so they answer the common questions in
    # one call. Reach for these first; the per-chat/per-JID tools below are
    # `[RAW]` power-user fallbacks.
    - name: list_conversations
      risk: read
      description: >-
        List WhatsApp conversations cached locally — the de-duplicated overview and the
        front door for "show me my recent conversations". Like list_chats but collapses a
        contact's linked phone JID (…@s.whatsapp.net) and privacy LID (…@lid) direct chats into
        ONE row (list_chats double-counts these as two), surfacing the merged identities as `jids`,
        a summed `unread_count`, and the newest last-message preview across the merge. Groups and
        newsletters pass through unchanged. Supports substring search (`query`, not `search`),
        pagination (applied AFTER merging, so a split contact counts as one item), and sort_by
        last_active (default) or name. To drill into one conversation's full timeline use
        get_conversation.
        Served from local cache, which may lag live WhatsApp. An empty result can mean
        'not yet synced,' not 'no message.' For a guaranteed-fresh read: cache_sync →
        poll cache_sync_status until finished → read.
      input_schema:
        type: object
        properties:
          query:
            type: [string, "null"]
            description: "Case-insensitive substring match on the conversation's title or any of its merged JIDs. Like list_chats, 1:1 chats usually have no title, so searching a person's name here may miss their direct conversation — use search_contacts → get_conversation instead. query is for named groups."
          limit:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
          page:
            type: integer
            minimum: 0
            default: 0
            description: "0-based page index. Pagination is applied AFTER linked identities are merged, so a split contact counts as one item."
          include_last_message:
            type: boolean
            default: true
          sort_by:
            type: string
            enum: [last_active, name]
            default: last_active
            description: "Result ordering. Default 'last_active' => most-recently-active-first; 'name' => A-Z by title (untitled conversations last)."
          chat_type:
            type: [string, "null"]
            enum: [direct, group, newsletter, community, null]
            description: "Filter to a single chat type."
        required: []

    - name: get_conversation
      risk: read
      scope_param: contact
      description: >-
        get_conversation(contact): the canonical front door for "what's the latest with
        this person?". Merges every chat for a contact across their phone JID (…@s.whatsapp.net)
        and privacy LID (…@lid) into one newest-first timeline, de-duplicated, with resolved
        sender names and delivered/read status on each message. Use this instead of
        get_direct_chat_by_contact when you just want the full conversation; the lower-level
        per-JID tools remain available for power use.
        Served from local cache, which may lag live WhatsApp. An empty result can mean
        'not yet synced,' not 'no message.' For a guaranteed-fresh read: cache_sync →
        poll cache_sync_status until finished → read.
      input_schema:
        type: object
        properties:
          contact:
            type: string
            minLength: 1
            description: "Full JID (…@s.whatsapp.net or …@lid) or bare phone number of the contact."
          limit:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
          page:
            type: integer
            minimum: 0
            default: 0
          before:
            type: [string, "null"]
            description: "ISO-8601 timestamp; only messages strictly before this are returned."
          after:
            type: [string, "null"]
            description: "ISO-8601 timestamp; only messages strictly after this are returned."
        required: [contact]

    # ── media ─────────────────────────────────────────────────────────
    # The one tool whose payload can't ride in a tool result. `download`
    # (x-overslash-download) declares that the result *points at* the bytes
    # rather than carrying them: the container downloads from WhatsApp's CDN,
    # stores the file content-addressed, and returns `{media_path, mime,
    # size, filename, sha256}`. Overslash swaps `media_path` for a short-lived
    # `download_url` of its own, fetched later with the instance's bearer.
    #
    # `media_path` is relative (`/media/<sha256>`), so it resolves against this
    # instance's own URL — Overslash rejects anything that would resolve
    # off-origin rather than sending this service's credential elsewhere.
    - name: download_media
      risk: read
      scope_param: chat_jid
      description: >-
        download_media(chat_jid, message_id): fetch the bytes of a media message
        (image, video, audio, document, sticker) found via get_conversation or
        list_messages. Returns a short-lived download URL, NOT the file — the
        bytes never enter your context. Pipe it straight to disk, e.g.
        `curl -sSfL -o <path> "<download_url>"`. Call with `deliver: "url"`.
        Media metadata is captured at ingest, so a message that predates the
        container's media support may need a `cache_sync` re-ingest first.
      download:
        url: .structured.media_path
        mime: .structured.mime
        size: .structured.size
        filename: .structured.filename
        # Not used to fetch anything. It is what lets the gateway record this
        # descriptor in its media ledger, so a later send_file that merely
        # references these bytes can say what they are.
        sha256: .structured.sha256
        auth: inherit
      disclose:
        - label: Chat
          filter: .arguments.chat_jid
        - label: Message
          primary: true
          filter: .arguments.message_id
      input_schema:
        type: object
        properties:
          chat_jid:
            type: string
            minLength: 1
            description: "Full chat JID (…@s.whatsapp.net, …@lid or …@g.us) the message belongs to."
          message_id:
            type: string
            minLength: 1
            description: "Stanza id of the media message, as returned by get_conversation / list_messages."
        required: [chat_jid, message_id]

    # Not a tool the container serves. `POST /media` is plain HTTP on the same
    # origin and behind the same bearer as /mcp, so this entry exists to make
    # the push a permission-checked, approvable, disclosed action like any
    # other; the gateway intercepts it before it would ever reach tools/call.
    #
    # Handing an agent the container's URL and AUTH_TOKEN instead is the one
    # thing the vault exists to prevent: that token is static and unscoped, so
    # it authorizes every WhatsApp write this container can make, not just an
    # upload. This capability is the narrower thing that did not otherwise
    # exist.
    - name: upload_media
      risk: write
      description: >-
        Get a one-shot URL for pushing a file into this container. Returns an
        upload_url with the method it takes, when it expires and the byte
        ceiling — send the raw bytes there and you get back a
        `/media/<sha256>` reference to pass to send_file or send_audio_message. The bytes never enter your context in either
        direction. Declare sha256 and size_bytes when you know them: they are
        verified while the bytes stream through, so a push that does not match
        what was approved fails instead of being stored.
      upload:
        path: /media
        method: POST
        filename_param: filename
        auth: inherit
        # The container's own default (MEDIA_MAX_UPLOAD_BYTES). Stated here so
        # the caller learns the limit at mint time rather than by hitting a 413
        # after sending 100 MiB.
        max_bytes: 104857600
        result:
          media_path: .media_path
          sha256: .sha256
          mime: .mime
          size: .size
          filename: .filename
      input_schema:
        type: object
        properties:
          filename:
            type: string
            description: "Name to advertise to the recipient when this is later sent as a document."
          mime:
            type: string
            description: "Content type of the bytes, e.g. image/jpeg. Sniffed by the container when omitted."
          size_bytes:
            type: integer
            minimum: 1
            description: "Exact byte length. Enforced during the push: a transfer that exceeds it is cut off mid-stream."
          sha256:
            type: string
            pattern: "^[0-9a-f]{64}$"
            description: >-
              Lowercase hex digest of the bytes. Binds this capability to one
              specific file: the gateway hashes the stream and refuses to hand
              back a media_path when the two disagree.
        required: []
      # An upload approval can only show what the caller DECLARED — the bytes
      # have not been offered yet. That is not a decoration: a declared sha256
      # is verified while they stream through, so what a reviewer approved is
      # what gets stored. Without one, the approval genuinely authorizes "some
      # bytes, to be chosen later", and should look like it.
      disclose:
        - label: "File"
          primary: true
          filter: '.arguments.filename // "unnamed upload"'
        - label: "Size"
          filter: ".arguments.size_bytes // empty"
        - label: "Type"
          filter: ".arguments.mime // empty"
        - label: "SHA-256"
          filter: ".arguments.sha256 // empty"

    # Sending media is the mirror image. Both send tools take a `media_path` —
    # a pointer to bytes ALREADY stored in the container — and there are three
    # ways to get one:
    #
    #   * `download_media` called WITHOUT `deliver: "url"` returns the raw
    #     descriptor, `media_path` included. That is the whole forwarding
    #     path: re-send an attachment someone sent you without the bytes ever
    #     touching an agent's context. With `deliver: "url"` the gateway
    #     swaps `media_path` for a download_url of its own, which these tools
    #     cannot take.
    #   * `upload_media` above, for originating new bytes.
    #   * `POST /media` on the container directly, which needs its URL and
    #     AUTH_TOKEN. Still out-of-band work for whoever operates the
    #     container, and the one case the gateway cannot describe — see the
    #     comment on media_path below.
    - name: send_file
      risk: write
      scope_param: recipient
      description: >-
        Send bytes already stored in this container to {recipient} as a media
        message — image, video, audio attachment, document or sticker. Pass
        the media_path a previous download_media returned (call it WITHOUT
        `deliver: "url"`, which would hand you a gateway download URL this
        tool cannot use). Bytes never travel through a tool call: this tool
        takes neither base64 nor a local filesystem path, and uploading new
        bytes is not reachable through the gateway. Use send_audio_message
        instead for a voice note.
      input_schema:
        type: object
        properties:
          recipient:
            type: string
            description: "Destination chat: a JID (`user@s.whatsapp.net` or `group@g.us`) or a raw phone number with country code (digits only)."
            resolve:
              tool: resolve_jid
              args:
                jid: '{recipient}'
              display: '{name}[ ({phone})]'
              scope: phone
          media_path:
            type: string
            minLength: 1
            description: "Reference to stored bytes: the `/media/<sha256>` path a download_media or upload_media descriptor carries. A bare `<sha256>` is accepted too."
            # Answered from the gateway's own ledger rather than the container,
            # so an approval reads "invoice.pdf (application/pdf, 240912 bytes)"
            # instead of asking a reviewer to sign off on a bare hash.
            #
            # Best-effort by design: bytes pushed to the container out of band
            # were never seen here, so their references stay un-enriched and
            # the filter below falls back to the raw path. That fallback is
            # lossless — the reviewer still sees exactly what will be sent —
            # so a miss is never misleading, only less helpful.
            resolve:
              source: media
              display: '{filename}[ ({mime}, {size} bytes)]'
          media_type:
            type: string
            enum: [auto, image, video, audio, document, sticker]
            default: auto
            description: "Envelope to send. `auto` picks from the stored mimetype: image/* -> image, video/* -> video, audio/* -> audio, image/webp -> sticker (what WhatsApp itself does with a .webp), anything else -> document. Stickers must be WebP; any other mimetype is refused."
          caption:
            type: string
            description: "Optional caption. Image, video and document envelopes only — passing one with audio or a sticker is REJECTED rather than silently dropped, since those envelopes cannot carry it."
          filename:
            type: string
            description: "Optional filename the recipient sees on a document send. Defaults to the name recorded when the bytes were stored."
          reply_to_id:
            type: string
            description: "Optional stanza id of the message to quote-reply to."
        required: [recipient, media_path]
      disclose:
        - label: "Recipient"
          filter: ".resolved.recipient // .arguments.recipient"
        - label: "JID"
          filter: ".arguments.recipient"
        - label: "File"
          primary: true
          filter: ".resolved.media_path // .arguments.media_path"
        - label: "Type"
          filter: '.arguments.media_type // "auto"'
        - label: "Caption"
          filter: ".arguments.caption // empty"
        - label: "Filename"
          filter: ".arguments.filename // empty"
        - label: "Reply to"
          filter: ".arguments.reply_to_id // empty"

    - name: send_audio_message
      risk: write
      scope_param: recipient
      description: >-
        Send stored audio to {recipient} as a voice note (PTT), taking the
        same media_path reference as send_file. Voice notes are Ogg/Opus or
        nothing: WhatsApp accepts another codec on the wire and then fails to
        play it, which the sender sees as a successful send. So other formats
        are transcoded when ffmpeg is available in the container, and REFUSED
        with invalid_argument when it is not — never sent unplayable. Use
        send_file for a plain audio attachment.
      input_schema:
        type: object
        properties:
          recipient:
            type: string
            description: "Destination chat: a JID (`user@s.whatsapp.net` or `group@g.us`) or a raw phone number with country code (digits only)."
            resolve:
              tool: resolve_jid
              args:
                jid: '{recipient}'
              display: '{name}[ ({phone})]'
              scope: phone
          media_path:
            type: string
            minLength: 1
            description: "Reference to stored audio: the `/media/<sha256>` path a download_media or upload_media descriptor carries. A bare `<sha256>` is accepted too."
            # Answered from the gateway's own ledger rather than the container,
            # so an approval reads "invoice.pdf (application/pdf, 240912 bytes)"
            # instead of asking a reviewer to sign off on a bare hash.
            #
            # Best-effort by design: bytes pushed to the container out of band
            # were never seen here, so their references stay un-enriched and
            # the filter below falls back to the raw path. That fallback is
            # lossless — the reviewer still sees exactly what will be sent —
            # so a miss is never misleading, only less helpful.
            resolve:
              source: media
              display: '{filename}[ ({mime}, {size} bytes)]'
          reply_to_id:
            type: string
            description: "Optional stanza id of the message to quote-reply to."
        required: [recipient, media_path]
      disclose:
        - label: "Recipient"
          filter: ".resolved.recipient // .arguments.recipient"
        - label: "JID"
          filter: ".arguments.recipient"
        - label: "Voice note"
          primary: true
          filter: ".resolved.media_path // .arguments.media_path"
        - label: "Reply to"
          filter: ".arguments.reply_to_id // empty"

    # ── chats (read-side, cache-backed) — [RAW] power-user fallbacks ──
    - name: list_chats
      risk: read
      description: >-
        [RAW] Low-level single-chat/JID access — prefer list_conversations (overview) or
        get_conversation (one person's full timeline), which merge a contact's phone JID + @lid
        automatically. Use this only for power/precision access.
        List WhatsApp chats cached locally. Supports substring search,
        pagination, and optional inclusion of each chat's last message preview.
        NOTE: query matches the chat's stored title only. 1:1 chats usually have
        no title, so searching a person's name here WILL MISS their direct chat —
        use search_contacts → get_contact_chats instead. query is for named groups.
        The search arg is `query` (not `search`). Ordered most-recently-active-first
        unless sort_by=name (A→Z by title).
        Served from local cache, which may lag live WhatsApp. An empty result can mean
        'not yet synced,' not 'no message.' For a guaranteed-fresh read: cache_sync →
        poll cache_sync_status until finished → read.
      input_schema:
        type: object
        properties:
          query:
            type: string
            description: "The search argument (named 'query', NOT 'search'). Case-insensitive substring match on the chat's stored title (or JID). 1:1 chats usually have no title, so searching a person's name here WILL MISS their direct chat — use search_contacts then get_contact_chats instead. query is for named groups."
          limit:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
          page:
            type: integer
            minimum: 0
            default: 0
            description: "0-based page index."
          include_last_message:
            type: boolean
            default: true
          sort_by:
            type: string
            enum: [last_active, name]
            default: last_active
            description: "Result ordering. Default 'last_active' => most-recently-active-first (last_message_ts DESC); 'name' => A-Z by title (untitled chats last)."
          chat_type:
            type: string
            enum: [direct, group, newsletter, community]
            description: "Filter to a single chat type."
        required: []

    - name: get_chat
      risk: read
      scope_param: chat_jid
      description: >-
        [RAW] Low-level single-chat/JID access — prefer list_conversations (overview) or
        get_conversation (one person's full timeline), which merge a contact's phone JID + @lid
        automatically. Use this only for power/precision access.
        Fetch cached metadata for a single WhatsApp chat by JID, optionally including the last message preview.
        Served from local cache, which may lag live WhatsApp. An empty result can mean
        'not yet synced,' not 'no message.' For a guaranteed-fresh read: cache_sync →
        poll cache_sync_status until finished → read.
      input_schema:
        type: object
        properties:
          chat_jid:
            type: string
            minLength: 1
          include_last_message:
            type: boolean
            default: true
        required: [chat_jid]

    - name: list_messages
      risk: read
      description: >-
        [RAW] Low-level single-chat/JID access — prefer list_conversations (overview) or
        get_conversation (one person's full timeline), which merge a contact's phone JID + @lid
        automatically. Use this only for power/precision access.
        List cached WhatsApp messages. Supports filtering by chat, sender,
        full-text body search (FTS5 when `query` is set), and timestamp range.
        is_from_me reflects the sending account/device, not the speaker's role.
        With multi-device or business accounts the same person can send from multiple JIDs,
        and an operator controlling both ends sees their own JID on both sides.
        Don't infer who said what from message content — trust sender JID + is_from_me.
        Always ordered newest-first; there is no sort parameter — use before/after for ranges.
        The search arg is `query` (not `search`).
        Served from local cache, which may lag live WhatsApp. An empty result can mean
        'not yet synced,' not 'no message.' For a guaranteed-fresh read: cache_sync →
        poll cache_sync_status until finished → read.
      input_schema:
        type: object
        properties:
          chat_jid:
            type: [string, "null"]
            description: "Restrict to one chat key (a chat's JID). Distinct from contact_jid/sender_jid."
          sender_jid:
            type: [string, "null"]
            description: "Restrict to messages authored by this JID."
          query:
            type: [string, "null"]
            description: "The search argument (named 'query', NOT 'search'). Full-text search across message bodies (FTS5 when set; LIKE fallback handled server-side)."
          after:
            type: [string, "null"]
            description: "ISO-8601 timestamp (a date/time string, NOT a count); only messages strictly after this are returned."
          before:
            type: [string, "null"]
            description: "ISO-8601 timestamp (a date/time string, NOT a count); only messages strictly before this are returned."
          limit:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
          page:
            type: integer
            minimum: 0
            default: 0
            description: "0-based page index. Results are always ordered newest-first; there is NO sort parameter — page through time with before/after."
        required: []

    - name: get_message_context
      risk: read
      scope_param: message_id
      description: >-
        [RAW] Low-level single-chat/JID access — prefer list_conversations (overview) or
        get_conversation (one person's full timeline), which merge a contact's phone JID + @lid
        automatically. Use this only for power/precision access.
        Fetch the N messages immediately before and after a target message,
        scoped to the same chat_jid as the target. before/after are integer counts
        (window sizes), not timestamps; returned before/after arrays are chronological.
        Served from local cache, which may lag live WhatsApp. An empty result can mean
        'not yet synced,' not 'no message.' For a guaranteed-fresh read: cache_sync →
        poll cache_sync_status until finished → read.
      input_schema:
        type: object
        properties:
          message_id:
            type: string
            minLength: 1
          before:
            type: integer
            minimum: 0
            maximum: 100
            default: 5
            description: "Number of messages to fetch immediately BEFORE the target — an integer COUNT, not a timestamp (contrast list_messages, where before is an ISO date)."
          after:
            type: integer
            minimum: 0
            maximum: 100
            default: 5
            description: "Number of messages to fetch immediately AFTER the target — an integer COUNT, not a timestamp."
        required: [message_id]

    - name: get_direct_chat_by_contact
      risk: read
      scope_param: contact_jid
      description: >-
        [RAW] Low-level single-chat/JID access — prefer list_conversations (overview) or
        get_conversation (one person's full timeline), which merge a contact's phone JID + @lid
        automatically. Use this only for power/precision access.
        Resolve {contact_jid} to the 1:1 chat. NOTE: a contact can have
        separate chats under their phone JID (…@s.whatsapp.net) and their privacy
        LID (…@lid), and messages may split across both. This resolves to the
        phone-JID chat only and can return an empty/stale thread even when an active
        conversation exists under the LID. To see everything, call get_contact_chats first.
        Served from local cache, which may lag live WhatsApp. An empty result can mean
        'not yet synced,' not 'no message.' For a guaranteed-fresh read: cache_sync →
        poll cache_sync_status until finished → read.
      input_schema:
        type: object
        properties:
          contact_jid:
            type: string
            minLength: 1
            description: "JID or bare phone number of the contact."
        required: [contact_jid]

    - name: get_contact_chats
      risk: read
      scope_param: contact_jid
      description: >-
        [RAW] Low-level single-chat/JID access — prefer list_conversations (overview) or
        get_conversation (one person's full timeline), which merge a contact's phone JID + @lid
        automatically. Use this only for power/precision access.
        Find the full conversation with a contact. Use this to locate the conversation
        when a contact may exist under multiple JIDs (phone JID + @lid privacy LID): it matches
        both the direct chat keyed on the JID you pass AND every other chat where that JID is a
        recorded sender, so you surface the contact's threads instead of having to guess the exact
        chat key. Returns every cached chat (direct + groups) involving the given
        contact JID, ordered most-recent-first, so the latest thread surfaces at the top. If you
        only have one of a contact's identities, call this with it; pass the other JID in a
        follow-up call to cover the remaining identity.
        Keywords: conversation, thread, full history, all chats, latest message, did they reply.
        Served from local cache, which may lag live WhatsApp. An empty result can mean
        'not yet synced,' not 'no message.' For a guaranteed-fresh read: cache_sync →
        poll cache_sync_status until finished → read.
      input_schema:
        type: object
        properties:
          contact_jid:
            type: string
            minLength: 1
          limit:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
          page:
            type: integer
            minimum: 0
            default: 0
        required: [contact_jid]

    - name: get_last_interaction
      risk: read
      scope_param: contact_jid
      description: >-
        [RAW] Low-level single-chat/JID access — prefer list_conversations (overview) or
        get_conversation (one person's full timeline), which merge a contact's phone JID + @lid
        automatically. Use this only for power/precision access.
        Return the most recent cached message exchanged with the contact —
        either in the 1:1 chat keyed on their JID or any group where they were the sender.
        is_from_me reflects the sending account/device, not the speaker's role.
        With multi-device or business accounts the same person can send from multiple JIDs,
        and an operator controlling both ends sees their own JID on both sides.
        Don't infer who said what from message content — trust sender JID + is_from_me.
        Returns only the single most recent message.
        Served from local cache, which may lag live WhatsApp. An empty result can mean
        'not yet synced,' not 'no message.' For a guaranteed-fresh read: cache_sync →
        poll cache_sync_status until finished → read.
      input_schema:
        type: object
        properties:
          contact_jid:
            type: string
            minLength: 1
        required: [contact_jid]

    # ── account & presence (MUTATES ACCOUNT STATE) ────────────────────
    # Everything in this section changes state other WhatsApp users can see,
    # under the identity of the paired phone number, and none of it is a
    # message. That combination is easy to under-weight: "set a typing
    # indicator" reads like a no-op and is in fact this account telling a
    # specific person it is talking to them right now. They are all `write`
    # for that reason, and each disclose block names the observable effect
    # rather than the argument shape.
    - name: set_status_message
      risk: write
      description: >-
        Overwrite the account's About text — the one-line bio on the profile,
        visible to everyone the account's privacy settings allow. This is NOT
        a status broadcast/story. Max 139 characters; an empty string clears
        it. There is no undo and the previous text is not readable from here,
        so a caller that may want it back must have saved it first.
      input_schema:
        type: object
        properties:
          text:
            type: string
            maxLength: 139
            description: "New About text, 0-139 characters. An empty string clears the About line."
        required: [text]
      disclose:
        - label: "About"
          primary: true
          filter: '.arguments.text | if . == "" then "(clear the About line)" else . end'

    - name: send_presence
      risk: write
      description: >-
        Publish the account's global availability: `available` marks it
        online, `unavailable` marks it offline. Contacts allowed to see
        last-seen observe the change immediately. Marking available is also
        the prerequisite for actually receiving the updates
        subscribe_presence asks for — the server stops delivering them to a
        device that reports itself offline.
      input_schema:
        type: object
        properties:
          presence:
            type: string
            enum: [available, unavailable]
            description: "`available` marks the account online; `unavailable` marks it offline."
        required: [presence]
      disclose:
        - label: "Presence"
          primary: true
          filter: ".arguments.presence"

    - name: send_chat_presence
      risk: write
      scope_param: chat_jid
      description: >-
        Show or clear the typing indicator in {chat_jid}. `composing` with
        media `text` renders as "typing…" and with media `audio` as
        "recording audio…"; `paused` clears it. The other party sees it live.
        WhatsApp expires the indicator after a few seconds, so a sustained
        indicator means re-sending — this tool does not hold one open.
      input_schema:
        type: object
        properties:
          chat_jid:
            type: string
            minLength: 1
            description: "Chat to publish the indicator in: a user JID (`…@s.whatsapp.net` or `…@lid`), a group JID (`…@g.us`), or a raw phone number with country code."
            resolve:
              tool: resolve_jid
              args:
                jid: '{chat_jid}'
              display: '{name}[ ({phone})]'
              scope: phone
          state:
            type: string
            enum: [composing, paused]
            description: "`composing` shows the indicator; `paused` clears it."
          media:
            type: string
            enum: [text, audio]
            default: text
            description: "Which composing indicator to show: `text` for \"typing…\", `audio` for \"recording audio…\". Only meaningful with state=`composing`."
        required: [chat_jid, state]
      disclose:
        - label: "Chat"
          filter: ".resolved.chat_jid // .arguments.chat_jid"
        - label: "JID"
          filter: ".arguments.chat_jid"
        - label: "State"
          primary: true
          filter: ".arguments.state"
        - label: "Indicator"
          filter: ".arguments.media // empty"

    - name: subscribe_presence
      risk: write
      scope_param: jid
      description: >-
        Ask the server to push online/offline updates for {jid}. The
        subscription is server-side and visible to WhatsApp as activity from
        this account — it is a write for that reason, not because it changes
        anything locally. Updates arrive asynchronously and are cached
        against the contact; read them back with get_contact_details, which
        reports `presence_observed: false` for a contact nothing has arrived
        for rather than claiming they are offline. Requires this account to
        be marked available (send_presence) for delivery to continue. Groups
        do not publish presence.
      input_schema:
        type: object
        properties:
          jid:
            type: string
            minLength: 1
            description: "User JID to watch (`…@s.whatsapp.net` or `…@lid`), or a raw phone number with country code."
            resolve:
              tool: resolve_jid
              args:
                jid: '{jid}'
              display: '{name}[ ({phone})]'
              scope: phone
        required: [jid]
      disclose:
        - label: "Contact"
          primary: true
          filter: ".resolved.jid // .arguments.jid"
        - label: "JID"
          filter: ".arguments.jid"

    - name: set_disappearing_timer
      risk: write
      scope_param: chat_jid
      description: >-
        Change the disappearing-message timer for {chat_jid} to {duration}.
        The change applies to EVERY participant, is announced in the chat
        itself, and causes future messages to be deleted on all devices once
        the timer elapses. Only `off`, `24h`, `7d` and `90d` are accepted —
        whatsmeow will forward any duration, which official clients then
        ignore and the server rejects in groups, so a wider vocabulary would
        only let a caller "succeed" at setting a timer nobody honours.
      input_schema:
        type: object
        properties:
          chat_jid:
            type: string
            minLength: 1
            description: "Chat to change: a user JID (`…@s.whatsapp.net` or `…@lid`), a group JID (`…@g.us`), or a raw phone number with country code."
            resolve:
              tool: resolve_jid
              args:
                jid: '{chat_jid}'
              display: '{name}[ ({phone})]'
              scope: phone
          duration:
            type: string
            enum: [off, 24h, 7d, 90d]
            description: "Timer to apply. These are the only values WhatsApp honours."
        required: [chat_jid, duration]
      disclose:
        - label: "Chat"
          primary: true
          filter: ".resolved.chat_jid // .arguments.chat_jid"
        - label: "JID"
          filter: ".arguments.chat_jid"
        - label: "Timer"
          filter: ".arguments.duration"

    - name: set_default_disappearing_timer
      risk: write
      description: >-
        Change the account-wide default disappearing-message timer applied to
        NEWLY started chats. Existing chats keep whatever timer they already
        have, so this is not a way to change them in bulk. Only `off`, `24h`,
        `7d` and `90d` are accepted.
      input_schema:
        type: object
        properties:
          duration:
            type: string
            enum: [off, 24h, 7d, 90d]
            description: "Timer to apply to new chats. These are the only values WhatsApp honours."
        required: [duration]
      disclose:
        - label: "Timer"
          primary: true
          filter: ".arguments.duration"

    - name: mark_read
      risk: write
      scope_param: chat_jid
      description: >-
        Send a read receipt for one or more messages in {chat_jid}, turning
        the sender's ticks blue and moving their last-read position. Also
        clears the chat's cached unread flag. All ids must be from the SAME
        author — WhatsApp encodes one author per receipt — and sender_jid is
        required in group chats. Cannot be undone: a receipt is a claim to
        the other party that this account read their message, and there is no
        way to retract it.
      input_schema:
        type: object
        properties:
          chat_jid:
            type: string
            minLength: 1
            description: "Chat the messages live in: a user JID (`…@s.whatsapp.net` or `…@lid`), a group JID (`…@g.us`), a newsletter JID, or a raw phone number with country code."
            resolve:
              tool: resolve_jid
              args:
                jid: '{chat_jid}'
              display: '{name}[ ({phone})]'
              scope: phone
          message_ids:
            type: array
            items:
              type: string
              minLength: 1
            minItems: 1
            maxItems: 200
            description: "Stanza ids to acknowledge. All must have been sent by the same author."
          sender_jid:
            type: string
            description: "Author of the messages. Required in group chats; ignored in direct chats, where the author is the chat itself."
        required: [chat_jid, message_ids]
      disclose:
        - label: "Chat"
          primary: true
          filter: ".resolved.chat_jid // .arguments.chat_jid"
        - label: "JID"
          filter: ".arguments.chat_jid"
        - label: "Messages"
          filter: ".arguments.message_ids | length"
        - label: "Author"
          filter: ".arguments.sender_jid // empty"

    # ── cache diagnostics / control ──
    - name: cache_sync_status
      risk: read
      description: "Diagnostic snapshot of the local cache (chat/message/contact counts, last ingested event, sync run state)"
      input_schema:
        type: object
        properties: {}
        required: []

    - name: cache_sync
      risk: write
      description: "Trigger reconciliation of the local cache against authoritative whatsmeow endpoints; returns immediately with a `sync_id`"
      # `//` would swallow `false`, so probe with has().
      disclose:
        - label: Force
          filter: '.arguments // {} | if has("force") then .force else empty end'
      input_schema:
        type: object
        properties:
          force:
            type: boolean
            default: false
            description: "Reserved. Today no-op while a sync is running (the in-progress `sync_id` is returned regardless)."
        required: []
