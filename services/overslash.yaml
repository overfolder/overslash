openapi: 3.1.0
x-overslash-runtime: platform
info:
  title: Overslash Platform
  description: Administrative access to the Overslash platform
  key: overslash
  category: Platform
platform_actions:
  manage_members:
    description: "Manage org member roles and group assignments"
    risk: delete
  manage_groups:
    description: "Create, update, and delete groups and grants"
    risk: delete
  manage_secrets:
    description: "Create and update secrets"
    risk: write
  delete_secrets:
    description: "Delete secrets permanently"
    risk: delete
  manage_templates_own:
    description: "Author and manage service templates under your own scope"
    risk: write
  manage_templates_publish:
    description: "Publish service templates org-wide or globally (dashboard only)"
    risk: delete
  manage_webhooks:
    description: "Create, update, and delete webhooks"
    risk: delete
  manage_enrollment:
    description: "Create and manage enrollment tokens"
    risk: delete
  create_agents:
    description: "Create agent and sub-agent identities"
    risk: write
  create_users:
    description: "Create user identities"
    risk: delete
  manage_connections_own:
    description: "Create and delete OAuth connections the caller owns"
    risk: write
  manage_byoc:
    description: "Manage bring-your-own-credential configurations"
    risk: delete
  resolve_approvals:
    description: "Resolve pending approval requests"
    risk: write
  manage_services_own:
    description: "Create and update service instances the caller owns"
    risk: write
  manage_services_share:
    description: "Grant service instances to non-Myself groups (org-wide sharing)"
    risk: write
  request_secrets_own:
    description: "Mint a signed provide URL to request a secret value for the caller's own identity (or a descendant)"
    risk: write
  request_secrets_share:
    description: "Mint a signed provide URL targeting another identity in the org (admin-only — never auto-grantable to agents)"
    risk: write
  delete_services:
    description: "Delete and manage service instance lifecycle"
    risk: delete
  manage_permissions:
    description: "Create and delete permission rules"
    risk: delete
  manage_api_keys:
    description: "Create API keys"
    risk: delete
  list_pending:
    description: >
      List the caller's approved actions that still need attention: those with
      a pending execution (ready to dispatch or cancel) plus those that already
      ran automatically and whose output the caller has never fetched. Returns
      an array of approval objects; each includes a nested execution with
      status, expires_at, output_read, and result. Prefer get_events, which
      also surfaces approvals waiting on the caller to resolve.
    risk: read
  get_result:
    description: >
      Fetch the outcome of a previously-approved action. Requires
      params.approval_id (string). Returns the execution's status
      (pending | executing | executed | failed | cancelled | expired), the
      result body, error, and http_status_code. Resuming with approval_id
      cannot fetch this — that returns 409 once the action has run. Reading
      here is also what marks the output as read, so it stops appearing in
      get_events.
    risk: read
  get_events:
    description: >
      Poll for anything needing the caller's attention. Returns an array of
      events, each with a type: approval_needed (someone in your subtree is
      blocked and you can resolve it), ready_to_call (your approved action is
      waiting to be dispatched), or result_unread (your action already ran and
      you have not read its output — fetch it with get_result). Result bodies
      are omitted here; use get_result for the payload.
    risk: read
  call_pending:
    description: >
      Dispatch a previously-approved action. Requires params.approval_id
      (string). The execution must still be in pending state — it expires 15
      minutes after the approval was granted.
    risk: write
  cancel_pending:
    description: >
      Cancel a pending execution. Requires params.approval_id (string). The
      requesting agent or any resolver with write access may cancel.
    risk: write

  get_execution:
    description: >
      Fetch the outcome of an async action call — one made with
      execution: "async". Requires params.execution_id (string), which came
      back in the accepted response. Returns the status
      (pending | executing | executed | failed | cancelled | expired), the
      result body, error, and http_status_code. Poll this until the status is
      terminal. Reading here is also what marks the output as read.
    risk: read
  cancel_execution:
    description: >
      Cancel an async action call. Requires params.execution_id (string).
      A call that has not started yet is cancelled outright; one already in
      flight stops being waited on, but the upstream request has already been
      sent and cannot be recalled — cancelling means you will not get the
      result, not that nothing happened.
    risk: write

  ping:
    description: "Ping the platform runtime (no-op health check)"
    risk: read

  list_templates:
    description: "List all service templates visible to the caller"
    risk: read
    permission: manage_templates_own

  get_template:
    description: "Get a service template by key"
    risk: read
    permission: manage_templates_own
    params:
      key: { type: string, required: true }

  create_template:
    description: "Create a new service template (atomic — succeeds or returns validation errors)"
    risk: write
    permission: manage_templates_own
    params:
      openapi: { type: string, required: true }
      user_level: { type: boolean, required: false }

  import_template:
    description: "Import an OpenAPI spec as a draft template (lenient — surfaces validation issues without rejecting)"
    risk: write
    permission: manage_templates_own
    params:
      openapi: { type: string, required: true }
      user_level: { type: boolean, required: false }
      include_operations: { type: array, required: false }
      key: { type: string, required: false }
      display_name: { type: string, required: false }
      draft_id: { type: string, required: false }

  delete_template:
    # `risk: write` (not `delete`) so a caller with the standard
    # Everyone-group `write` ceiling on `overslash` can delete templates they
    # own. The destructive case — deleting an org-tier template — is gated
    # inside the kernel via an admin-access check (and ownership for user-tier
    # rows), so the runtime `risk` reflects the user-tier path the agent
    # surface is designed for.
    description: "Delete an active service template by key (user-tier; org-tier requires admin access)"
    risk: write
    permission: manage_templates_own
    params:
      key: { type: string, required: true }

  list_services:
    description: "List service instances visible to the caller"
    risk: read
    permission: manage_services_own

  get_service:
    description: "Get a service instance by name or id"
    risk: read
    permission: manage_services_own
    params:
      name: { type: string, required: true }
      include_inactive: { type: boolean, required: false }

  create_service:
    description: >
      Create a service instance from a template. The instance is auto-granted to
      the owner's Myself group with admin access and read-level auto-approval. For
      OAuth-backed templates the new row carries credentials_status =
      "needs_authentication" — start the OAuth flow before calling actions.
      An org-level instance (user_level: false) has no Myself group, so `groups`
      is required there: pass at least one group you are a member of, as
      [{ group_id, access_level, auto_approve_reads }] with access_level one of
      read | write | admin (default "write").
    risk: write
    permission: manage_services_own
    params:
      template_key: { type: string, required: true }
      name: { type: string, required: false }
      connection_id: { type: string, required: false }
      secret_name: { type: string, required: false }
      url: { type: string, required: false }
      status: { type: string, required: false }
      user_level: { type: boolean, required: false }
      groups: { type: array, required: false }
      on_behalf_of: { type: string, required: false }

  update_service:
    description: "Update mutable fields on a service instance (name, connection, secret, url)"
    risk: write
    permission: manage_services_own
    params:
      id: { type: string, required: true }
      name: { type: string, required: false }
      connection_id: { type: string, required: false }
      secret_name: { type: string, required: false }
      url: { type: string, required: false }

  create_connection:
    description: >
      Start the OAuth dance for a provider. Returns an `auth_url` pointing
      at Overslash's `/connect-authorize` gate (and an optional shortened
      form). Hand that URL to the user — the gate fail-fasts on session
      mismatch before redirecting to the provider, mitigating the chat-
      delivery pitfalls catalogued in the Obsidian "MCP meets OAuth"
      writeup. The raw provider URL is intentionally not surfaced over MCP;
      REST callers can opt-in via `include_raw` for white-label
      integrations. The actual connection row is minted in the OAuth
      callback after the user clicks; poll `overslash_auth(action:
      "service_status")` to see it land.
    risk: write
    permission: manage_connections_own
    params:
      provider: { type: string, required: true }
      scopes: { type: array, required: false }
      byoc_credential_id: { type: string, required: false }
      on_behalf_of: { type: string, required: false }
      login_hint: { type: string, required: false }

  request_secret:
    description: >
      Mint a signed, single-use URL the user can open to provide a secret
      value (e.g. an API key). The agent never sees the value — only the URL.
      Returns request_id, provide_url, optional short_url, and expires_at.
      Defaults to the caller's own identity; targeting another identity
      requires `request_secrets_share`.
    risk: write
    permission: request_secrets_own
    params:
      secret_name: { type: string, required: true }
      identity_id: { type: string, required: false }
      purpose: { type: string, required: false }
