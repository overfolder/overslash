openapi: 3.1.0
info:
  title: Google Calendar
  key: google_calendar
  category: Productivity
servers:
  - url: https://www.googleapis.com
security:
  - oauth:
      - https://www.googleapis.com/auth/calendar
components:
  securitySchemes:
    oauth:
      type: oauth2
      provider: google
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            https://www.googleapis.com/auth/calendar: ""
paths:
  /calendar/v3/users/me/calendarList:
    get:
      operationId: list_calendars
      # Neither half was declared: no bound, and no way to ask for the rest.
      # Both parameters exist upstream — the template simply never named them.
      pagination:
        page_size:
          param: maxResults
          default: 100
          max: 250
        next:
          style: cursor
          param: pageToken
          from: nextPageToken
        items: items
      summary: List all calendars for the authenticated user
      risk: read
      test: true
      parameters:
        - name: maxResults
          in: query
          description: Maximum number of calendars returned (max 250)
          schema:
            type: integer
        - name: pageToken
          in: query
          description: Continuation token from a previous response's `nextPageToken`.
          schema:
            type: string
        - name: minAccessRole
          in: query
          description: "Filter by minimum access role: freeBusyReader, reader, writer, owner"
          schema:
            type: string
            enum: [freeBusyReader, reader, writer, owner]
        - name: showHidden
          in: query
          description: Whether to show hidden calendars
          schema:
            type: boolean
  /calendar/v3/calendars/{calendarId}/events:
    parameters:
      - name: calendarId
        in: path
        required: true
        description: "Calendar identifier (use 'primary' for the main calendar)"
        schema:
          type: string
          default: primary
        resolve:
          get: /calendar/v3/calendars/{calendarId}
          pick: summary
    get:
      operationId: list_events
      # `maxResults` was declared without a `default:`, so omitting it left
      # Google to decide — 250 on a busy calendar, and unbounded in the sense
      # that mattered: there was no `pageToken`, so the rest was unreachable.
      pagination:
        page_size:
          param: maxResults
          default: 250
          max: 2500
        next:
          style: cursor
          param: pageToken
          from: nextPageToken
        items: items
      summary: "List events on calendar {calendarId}"
      risk: read
      scope_param: calendarId
      parameters:
        - name: timeMin
          in: query
          description: Lower bound (RFC3339 timestamp) for event start time
          schema:
            type: string
        - name: timeMax
          in: query
          description: Upper bound (RFC3339 timestamp) for event end time
          schema:
            type: string
        - name: maxResults
          in: query
          description: Maximum number of events returned (default 250)
          schema:
            type: integer
        - name: q
          in: query
          description: Free text search terms
          schema:
            type: string
        - name: orderBy
          in: query
          description: Order of results
          schema:
            type: string
            enum: [startTime, updated]
        - name: singleEvents
          in: query
          description: Whether to expand recurring events into instances
          schema:
            type: boolean
        - name: pageToken
          in: query
          description: Continuation token from a previous response's `nextPageToken`.
          schema:
            type: string
    post:
      operationId: create_event
      summary: "Create event '{summary}' on calendar {calendarId}"
      risk: write
      scope_param: calendarId
      disclose:
        - label: Calendar
          filter: .resolved.calendarId // .params.calendarId
        - label: Title
          primary: true
          filter: .body.summary
        - label: Start
          filter: .body.start.dateTime // .body.start.date // empty
        - label: End
          filter: .body.end.dateTime // .body.end.date // empty
        - label: Location
          filter: .body.location // empty
        - label: Attendees
          filter: '[.body.attendees[]?.email // empty] | select(length > 0) | join(", ")'
        - label: Notify attendees
          filter: .params.sendUpdates // empty
      parameters:
        - name: sendUpdates
          in: query
          description: "Whether to send notification emails to attendees: all, externalOnly, or none (default)"
          schema:
            type: string
            enum: [all, externalOnly, none]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [summary, start, end]
              properties:
                summary:
                  type: string
                  description: Title of the event
                start:
                  type: object
                  description: >-
                    Start time. Supply `dateTime` for a timed event or `date`
                    for an all-day one — never both.
                  properties:
                    dateTime:
                      type: string
                      description: "RFC 3339, e.g. 2026-03-01T09:00:00-05:00."
                    date:
                      type: string
                      description: "YYYY-MM-DD, for an all-day event."
                    timeZone:
                      type: string
                      description: >-
                        IANA name, e.g. Europe/Madrid. Required when
                        `dateTime` carries no offset, and for a recurring
                        event.
                end:
                  type: object
                  description: >-
                    End time, same shape as `start`. Exclusive for an all-day
                    event, so a single-day event ends on the following date.
                  properties:
                    dateTime:
                      type: string
                    date:
                      type: string
                    timeZone:
                      type: string
                description:
                  type: string
                  description: Description of the event
                location:
                  type: string
                  description: Geographic location of the event
                attendees:
                  type: array
                  description: "Who to invite."
                  items:
                    type: object
                    required: [email]
                    properties:
                      email:
                        type: string
                      displayName:
                        type: string
                      optional:
                        type: boolean
                        description: "Attendance is optional. Default false."
                      responseStatus:
                        type: string
                        enum: [needsAction, declined, tentative, accepted]
                reminders:
                  type: object
                  description: >-
                    Set `useDefault: false` when supplying `overrides`, or the
                    calendar's defaults win and the overrides are ignored.
                  properties:
                    useDefault:
                      type: boolean
                    overrides:
                      type: array
                      items:
                        type: object
                        required: [method, minutes]
                        properties:
                          method:
                            type: string
                            enum: [email, popup]
                          minutes:
                            type: integer
                            description: "Minutes before the event, 0-40320."
                recurrence:
                  type: array
                  description: "RRULE/EXRULE/RDATE/EXDATE lines, e.g. ['RRULE:FREQ=WEEKLY;COUNT=10']."
                  items:
                    type: string
                colorId:
                  type: string
                  description: "Color id of the event (1-11, see Colors.event in the Google Calendar API)"
  /calendar/v3/calendars/{calendarId}/events/{eventId}:
    parameters:
      - name: calendarId
        in: path
        required: true
        description: Calendar identifier
        schema:
          type: string
        resolve:
          get: /calendar/v3/calendars/{calendarId}
          pick: summary
      - name: eventId
        in: path
        required: true
        description: Event identifier
        schema:
          type: string
        resolve:
          get: /calendar/v3/calendars/{calendarId}/events/{eventId}
          pick: summary
    get:
      operationId: get_event
      summary: "Get event {eventId} on calendar {calendarId}"
      risk: read
      scope_param: calendarId
    patch:
      operationId: update_event
      summary: "Update event {eventId} on calendar {calendarId}"
      risk: write
      scope_param: calendarId
      disclose:
        - label: Calendar
          filter: .resolved.calendarId // .params.calendarId
        - label: Event
          filter: .resolved.eventId // .params.eventId
        - label: New title
          filter: .body.summary // empty
        - label: Start
          filter: .body.start.dateTime // .body.start.date // empty
        - label: End
          filter: .body.end.dateTime // .body.end.date // empty
        - label: Location
          filter: .body.location // empty
        - label: Attendees
          filter: '[.body.attendees[]?.email // empty] | select(length > 0) | join(", ")'
        - label: Notify attendees
          filter: .params.sendUpdates // empty
      parameters:
        - name: sendUpdates
          in: query
          description: "Whether to send notification emails to attendees: all, externalOnly, or none (default)"
          schema:
            type: string
            enum: [all, externalOnly, none]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                summary:
                  type: string
                  description: Title of the event
                start:
                  type: object
                  description: >-
                    Start time. Supply `dateTime` for a timed event or `date`
                    for an all-day one — never both.
                  properties:
                    dateTime:
                      type: string
                      description: "RFC 3339, e.g. 2026-03-01T09:00:00-05:00."
                    date:
                      type: string
                      description: "YYYY-MM-DD, for an all-day event."
                    timeZone:
                      type: string
                      description: >-
                        IANA name, e.g. Europe/Madrid. Required when
                        `dateTime` carries no offset, and for a recurring
                        event.
                end:
                  type: object
                  description: >-
                    End time, same shape as `start`. Exclusive for an all-day
                    event, so a single-day event ends on the following date.
                  properties:
                    dateTime:
                      type: string
                    date:
                      type: string
                    timeZone:
                      type: string
                description:
                  type: string
                  description: Description of the event
                location:
                  type: string
                  description: Geographic location of the event
                attendees:
                  type: array
                  description: "Who to invite."
                  items:
                    type: object
                    required: [email]
                    properties:
                      email:
                        type: string
                      displayName:
                        type: string
                      optional:
                        type: boolean
                        description: "Attendance is optional. Default false."
                      responseStatus:
                        type: string
                        enum: [needsAction, declined, tentative, accepted]
                reminders:
                  type: object
                  description: >-
                    Set `useDefault: false` when supplying `overrides`, or the
                    calendar's defaults win and the overrides are ignored.
                  properties:
                    useDefault:
                      type: boolean
                    overrides:
                      type: array
                      items:
                        type: object
                        required: [method, minutes]
                        properties:
                          method:
                            type: string
                            enum: [email, popup]
                          minutes:
                            type: integer
                            description: "Minutes before the event, 0-40320."
                recurrence:
                  type: array
                  description: "RRULE/EXRULE/RDATE/EXDATE lines, e.g. ['RRULE:FREQ=WEEKLY;COUNT=10']."
                  items:
                    type: string
                colorId:
                  type: string
                  description: "Color id of the event (1-11, see Colors.event in the Google Calendar API)"
    delete:
      operationId: delete_event
      summary: "Delete event {eventId} on calendar {calendarId}"
      risk: delete
      scope_param: calendarId
      disclose:
        - label: Calendar
          filter: .resolved.calendarId // .params.calendarId
        - label: Event
          filter: .resolved.eventId // .params.eventId
        - label: Notify attendees
          filter: .params.sendUpdates // empty
      parameters:
        - name: sendUpdates
          in: query
          description: "Whether to send notification emails to attendees: all, externalOnly, or none (default)"
          schema:
            type: string
            enum: [all, externalOnly, none]
