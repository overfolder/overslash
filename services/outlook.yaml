openapi: 3.1.0
info:
  title: Outlook
  description: Microsoft Outlook mail via the Graph API — send, read, search, and manage email messages, drafts, and mail folders.
  key: outlook
  category: Communication
servers:
  - url: https://graph.microsoft.com
components:
  securitySchemes:
    oauth:
      type: oauth2
      provider: microsoft
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
          # The top-level map is the *union* of every per-operation scope below.
          # Each operation's `security:` block declares the *minimum* scope
          # required, so a connection granted only Mail.Read can still read but
          # not send. `offline_access` is required for Microsoft to issue a
          # refresh token; `User.Read` backs the profile/identity call.
          scopes:
            https://graph.microsoft.com/Mail.Read: ""
            https://graph.microsoft.com/Mail.ReadWrite: ""
            https://graph.microsoft.com/Mail.Send: ""
            https://graph.microsoft.com/User.Read: ""
            offline_access: ""
paths:
  # Graph mail always targets the authenticated user's mailbox (`/me`), so —
  # unlike Gmail's `{userId}` model — there is no path parameter to scope on
  # and no `scope_param`. Permissions scope at the service level (outlook:*:*).
  /v1.0/me:
    get:
      operationId: get_profile
      summary: Get the signed-in user's Outlook profile
      risk: read
      security:
        - oauth:
            - https://graph.microsoft.com/User.Read
      parameters:
        - name: $select
          in: query
          description: "Comma-separated properties to return (e.g. 'displayName,mail,userPrincipalName')"
          schema:
            type: string
  /v1.0/me/messages:
    get:
      operationId: list_messages
      summary: Search and list mail messages
      risk: read
      security:
        - oauth:
            - https://graph.microsoft.com/Mail.Read
      parameters:
        - name: $search
          in: query
          description: "Full-text search over the mailbox (e.g. '\"subject:hello\"' or '\"from:user@example.com\"'). Cannot be combined with $orderby."
          schema:
            type: string
        - name: $filter
          in: query
          description: "OData filter (e.g. \"isRead eq false\" or \"from/emailAddress/address eq 'user@example.com'\")"
          schema:
            type: string
        - name: $select
          in: query
          description: "Comma-separated properties to return (e.g. 'subject,from,receivedDateTime,isRead')"
          schema:
            type: string
        - name: $orderby
          in: query
          description: "Sort order (e.g. 'receivedDateTime desc'). Cannot be combined with $search."
          schema:
            type: string
        - name: $top
          in: query
          description: Maximum number of messages to return (default 10, max 1000)
          schema:
            type: integer
        - name: $skip
          in: query
          description: Number of messages to skip (for paging)
          schema:
            type: integer
    post:
      operationId: create_draft
      summary: "Create a draft email: '{subject}'"
      risk: write
      security:
        - oauth:
            - https://graph.microsoft.com/Mail.ReadWrite
      # POST /me/messages takes the message resource directly (no `message`
      # wrapper), so filters read `.body.*`. Recipients are structured JSON,
      # so unlike Gmail there is no base64url decoding.
      disclose:
        - label: To
          filter: '[.body.toRecipients[]?.emailAddress.address // empty] | select(length > 0) | join(", ")'
        - label: Cc
          filter: '[.body.ccRecipients[]?.emailAddress.address // empty] | select(length > 0) | join(", ")'
        - label: Subject
          filter: .body.subject
        - label: Body
          filter: .body.body.content
          max_chars: 2000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject:
                  type: string
                  description: Subject line of the draft
                body:
                  type: object
                  description: "Message body: {contentType: 'Text' | 'HTML', content: '...'}"
                  properties:
                    contentType:
                      type: string
                      enum: [Text, HTML]
                    content:
                      type: string
                toRecipients:
                  type: array
                  description: "Primary recipients, each {emailAddress: {address: 'user@example.com', name: 'Optional Name'}}"
                ccRecipients:
                  type: array
                  description: "Cc recipients, same shape as toRecipients"
                bccRecipients:
                  type: array
                  description: "Bcc recipients, same shape as toRecipients"
  /v1.0/me/messages/{id}:
    get:
      operationId: get_message
      summary: Get a single mail message
      risk: read
      security:
        - oauth:
            - https://graph.microsoft.com/Mail.Read
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the message to retrieve
          schema:
            type: string
        - name: $select
          in: query
          description: "Comma-separated properties to return (e.g. 'subject,body,from,toRecipients')"
          schema:
            type: string
    patch:
      operationId: update_message
      summary: Update a message (draft content, read state, flag, or categories)
      risk: write
      security:
        - oauth:
            - https://graph.microsoft.com/Mail.ReadWrite
      # PATCH /me/messages/{id} takes message properties directly (`.body.*`).
      # Used both to edit a draft and to change flags/categories on any message.
      disclose:
        - label: Message
          filter: .resolved.id // .params.id
          max_chars: 200
        - label: Subject
          filter: .body.subject // empty
        - label: Mark read
          filter: 'if (.body | has("isRead")) then (.body.isRead | tostring) else empty end'
        - label: Categories
          filter: '(.body.categories // []) | join(", ")'
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the message to update
          schema:
            type: string
          resolve:
            get: /v1.0/me/messages/{id}?$select=subject
            pick: subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  description: New subject (drafts only)
                body:
                  type: object
                  description: "New body (drafts only): {contentType, content}"
                toRecipients:
                  type: array
                  description: "New recipients (drafts only)"
                isRead:
                  type: boolean
                  description: Mark the message read (true) or unread (false)
                flag:
                  type: object
                  description: "Follow-up flag, e.g. {flagStatus: 'flagged' | 'complete' | 'notFlagged'}"
                categories:
                  type: array
                  description: "Category names to assign (Outlook's label equivalent, e.g. ['Red category'])"
    delete:
      operationId: delete_message
      summary: Permanently delete a message
      risk: delete
      security:
        - oauth:
            - https://graph.microsoft.com/Mail.ReadWrite
      # DELETE removes the message outright. To move to the Deleted Items
      # folder instead (recoverable), use move_message with
      # destinationId: deleteditems.
      disclose:
        - label: Message
          filter: .resolved.id // .params.id
          max_chars: 200
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the message to delete
          schema:
            type: string
          resolve:
            get: /v1.0/me/messages/{id}?$select=subject
            pick: subject
  /v1.0/me/sendMail:
    post:
      operationId: send_mail
      summary: Send an email via Outlook
      risk: write
      security:
        - oauth:
            - https://graph.microsoft.com/Mail.Send
      # sendMail wraps the message one level deeper (`.body.message.*`) and
      # sends immediately. Recipients/subject/body are structured JSON, so the
      # reviewer sees them directly without decoding.
      disclose:
        - label: To
          filter: '[.body.message.toRecipients[]?.emailAddress.address // empty] | select(length > 0) | join(", ")'
        - label: Cc
          filter: '[.body.message.ccRecipients[]?.emailAddress.address // empty] | select(length > 0) | join(", ")'
        - label: Subject
          filter: .body.message.subject
        - label: Body
          filter: .body.message.body.content
          max_chars: 2000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: object
                  required: [subject, toRecipients]
                  properties:
                    subject:
                      type: string
                      description: Subject line
                    body:
                      type: object
                      description: "Message body: {contentType: 'Text' | 'HTML', content: '...'}"
                      properties:
                        contentType:
                          type: string
                          enum: [Text, HTML]
                        content:
                          type: string
                    toRecipients:
                      type: array
                      description: "Primary recipients, each {emailAddress: {address: 'user@example.com', name: 'Optional Name'}}"
                    ccRecipients:
                      type: array
                      description: "Cc recipients, same shape as toRecipients"
                    bccRecipients:
                      type: array
                      description: "Bcc recipients, same shape as toRecipients"
                saveToSentItems:
                  type: boolean
                  description: Whether to save the sent message to Sent Items (default true)
  /v1.0/me/messages/{id}/send:
    post:
      operationId: send_draft
      summary: Send a previously created draft
      risk: write
      security:
        - oauth:
            - https://graph.microsoft.com/Mail.Send
      # The send request has no body; the To/Subject/Body were set at
      # create_draft / update_message time. Resolve the id to the draft's
      # subject so the reviewer sees what is about to be sent.
      disclose:
        - label: Draft
          filter: .resolved.id // .params.id
          max_chars: 200
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the draft message to send
          schema:
            type: string
          resolve:
            get: /v1.0/me/messages/{id}?$select=subject
            pick: subject
  /v1.0/me/messages/{id}/move:
    post:
      operationId: move_message
      summary: Move a message to another mail folder
      risk: write
      security:
        - oauth:
            - https://graph.microsoft.com/Mail.ReadWrite
      disclose:
        - label: Message
          filter: .resolved.id // .params.id
          max_chars: 200
        - label: Destination
          filter: .body.destinationId
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the message to move
          schema:
            type: string
          resolve:
            get: /v1.0/me/messages/{id}?$select=subject
            pick: subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destinationId]
              properties:
                destinationId:
                  type: string
                  description: "Destination folder ID or well-known name (e.g. 'deleteditems', 'archive', 'inbox', 'junkemail')"
  /v1.0/me/mailFolders:
    get:
      operationId: list_folders
      summary: List mail folders
      risk: read
      security:
        - oauth:
            - https://graph.microsoft.com/Mail.Read
      parameters:
        - name: $select
          in: query
          description: "Comma-separated properties to return (e.g. 'displayName,unreadItemCount,totalItemCount')"
          schema:
            type: string
        - name: $top
          in: query
          description: Maximum number of folders to return
          schema:
            type: integer
        - name: $skip
          in: query
          description: Number of folders to skip (for paging)
          schema:
            type: integer
    post:
      operationId: create_folder
      summary: "Create mail folder '{displayName}'"
      risk: write
      security:
        - oauth:
            - https://graph.microsoft.com/Mail.ReadWrite
      disclose:
        - label: Folder
          filter: .body.displayName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
                  description: "Display name of the new folder (e.g. 'Overslash')"
                isHidden:
                  type: boolean
                  description: Whether the folder is hidden from the standard folder list
  /v1.0/me/mailFolders/{id}:
    get:
      operationId: get_folder
      summary: Get a single mail folder
      risk: read
      security:
        - oauth:
            - https://graph.microsoft.com/Mail.Read
      parameters:
        - name: id
          in: path
          required: true
          description: "The ID of the folder, or a well-known name (e.g. 'inbox', 'sentitems', 'drafts')"
          schema:
            type: string
    delete:
      operationId: delete_folder
      summary: Delete a mail folder
      risk: delete
      security:
        - oauth:
            - https://graph.microsoft.com/Mail.ReadWrite
      disclose:
        - label: Folder
          filter: .resolved.id // .params.id
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the folder to delete
          schema:
            type: string
          resolve:
            get: /v1.0/me/mailFolders/{id}
            pick: displayName
