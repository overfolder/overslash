# GitHub over OAuth. The configured client (`OAUTH_GITHUB_CLIENT_ID` /
# `OAUTH_GITHUB_CLIENT_SECRET` or a BYOC credential) may be either kind of
# GitHub app, and the same template serves both:
# - a classic OAuth App honours the `scopes` below, so the user grants `repo`
#   (private repos, issues, pull requests) and `read:org` on consent, and
#   approves each org under "Organization access";
# - a GitHub App ignores `scope` entirely: the token reaches the intersection of
#   the app's fine-grained permissions and its installations, and comes back
#   with an empty scope list. No action declares `required_scopes`, so that
#   empty list never gates a call.
# GitHub App user tokens expire (~8h) and refresh via the standard refresh
# grant; OAuth App tokens never expire. The authorize/token endpoints are the
# same for both. An org that would rather use neither can pick this template's
# `token` auth mode at creation and paste a personal access token; the modes
# are alternatives on the same host and the same paths.
openapi: 3.1.0
info:
  title: GitHub
  key: github
  category: Development
  description: >-
    GitHub over OAuth. With a classic OAuth App client, access is what the
    `repo` and `read:org` scopes grant, plus each organization's approval of
    the app. With a GitHub App client, the scopes are ignored and access is
    the app's permissions on the repositories or organizations it is
    installed on.
servers:
  - url: https://api.github.com
components:
  # GitHub accepts a user-to-server OAuth token and a personal access token in
  # the very same `Authorization: Bearer` header, so what differs between these
  # two modes is not the injection but where the credential comes from — and
  # therefore what bounds it. The App mode is bounded by the app's fine-grained
  # permissions and its installations; the token mode by whatever the PAT was
  # granted.
  x-overslash-auth-modes:
    oauth:
      label: Sign in with GitHub
      description: >-
        Authorize through the configured GitHub client. With an OAuth App that
        grants the repo and read:org scopes; with a GitHub App, access is the
        app's permissions on the installations you can reach.
      default: true
      schemes: [oauth]
    token:
      label: Personal access token
      description: >-
        Paste a fine-grained or classic PAT. Access is whatever the token was
        granted, and it stops working when the token expires or is revoked.
      schemes: [token]
  securitySchemes:
    token:
      type: http
      scheme: bearer
      x-overslash-label: GitHub personal access token
      description: >-
        A fine-grained or classic personal access token. A fine-grained token
        is preferable: it names the repositories it may touch.
      default_secret_name: github_pat
    oauth:
      type: oauth2
      provider: github
      flows:
        authorizationCode:
          authorizationUrl: https://github.com/login/oauth/authorize
          tokenUrl: https://github.com/login/oauth/access_token
          # Honoured by a classic OAuth App, ignored by a GitHub App (see the
          # header). `repo` is the only scope that reaches private
          # repositories, and it is read/write; Overslash's permission rules
          # and approvals are what narrow it per action.
          scopes:
            repo: Read and write repositories, issues and pull requests, public and private
            read:org: Read organization membership
paths:
  /user:
    get:
      operationId: get_authenticated_user
      summary: Get the authenticated user's profile
      risk: read
      test: true
  /user/installations:
    get:
      operationId: list_installations
      # GitHub pages with an RFC 8288 `Link` header, so `next` names no
      # parameter of its own — the header carries the whole next URL and the
      # gateway lifts out the query keys this action declares. `page` is
      # declared (and defaulted) for exactly that reason: a key the call did
      # not send is not a key the continuation can change, so without it
      # GitHub's `?page=2` is dropped and every call reports `has_more: false`.
      pagination:
        page_size:
          param: per_page
          max: 100
        next:
          style: link
      summary: List GitHub App installations accessible to the authenticated user
      description: >-
        Diagnostic for "app not installed" failures: lists the installations
        of this GitHub App that the user can access. Repositories outside
        these installations are invisible to the token. Only works when the
        configured client is a GitHub App; with a classic OAuth App GitHub
        answers 403 "You must authenticate with an access token authorized to
        a GitHub App", and org access is granted per org on the consent screen
        instead.
      risk: read
      parameters:
        - name: per_page
          in: query
          description: Results per page (max 100)
          schema:
            type: integer
            default: 30
        - name: page
          in: query
          description: Page number, counting from 1.
          schema:
            type: integer
            default: 1
  /user/repos:
    get:
      operationId: list_repos
      # Same shape as list_installations — see the comment there.
      pagination:
        page_size:
          param: per_page
          max: 100
        next:
          style: link
      summary: "List repositories for the authenticated user[, sorted by {sort}]"
      risk: read
      parameters:
        - name: sort
          in: query
          description: Sort by created, updated, pushed, full_name
          schema:
            type: string
            enum: [created, updated, pushed, full_name]
        - name: per_page
          in: query
          description: Results per page (max 100)
          schema:
            type: integer
            default: 30
        - name: page
          in: query
          description: Page number, counting from 1.
          schema:
            type: integer
            default: 1
  /repos/{repo}:
    get:
      operationId: get_repo
      summary: "Get repository {repo}"
      risk: read
      scope_param: repo
      parameters:
        - name: repo
          in: path
          required: true
          description: "owner/repo"
          schema:
            type: string
  /repos/{repo}/issues:
    parameters:
      - name: repo
        in: path
        required: true
        description: "owner/repo"
        schema:
          type: string
    get:
      operationId: list_issues
      # Same shape as list_installations — see the comment there.
      pagination:
        page_size:
          param: per_page
          max: 100
        next:
          style: link
      summary: "List issues on {repo}[ (state={state})]"
      risk: read
      scope_param: repo
      parameters:
        - name: state
          in: query
          description: Filter by state
          schema:
            type: string
            enum: [open, closed, all]
        - name: per_page
          in: query
          description: Results per page (max 100)
          schema:
            type: integer
            default: 30
        - name: page
          in: query
          description: Page number, counting from 1.
          schema:
            type: integer
            default: 1
    post:
      operationId: create_issue
      summary: "Create issue '{title}' on {repo}"
      risk: write
      scope_param: repo
      disclose:
        - label: Repository
          filter: .params.repo
        - label: Title
          primary: true
          filter: .body.title
        - label: Body
          primary: true
          filter: .body.body // empty
          max_chars: 2000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                body:
                  type: string
  /repos/{repo}/pulls:
    post:
      operationId: create_pull_request
      summary: "Create pull request '{title}' on {repo}"
      risk: write
      scope_param: repo
      disclose:
        - label: Repository
          filter: .params.repo
        - label: Title
          primary: true
          filter: .body.title
        - label: From branch
          filter: .body.head
        - label: Into branch
          filter: .body.base
        - label: Description
          primary: true
          filter: .body.body // empty
          max_chars: 2000
      parameters:
        - name: repo
          in: path
          required: true
          description: "owner/repo"
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, head, base]
              properties:
                title:
                  type: string
                  description: PR title
                head:
                  type: string
                  description: Branch to merge from
                base:
                  type: string
                  description: Branch to merge into
                body:
                  type: string
                  description: PR description
