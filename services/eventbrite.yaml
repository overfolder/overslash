openapi: 3.1.0
info:
  title: Eventbrite
  key: eventbrite
  category: Events
servers:
  - url: https://www.eventbriteapi.com
components:
  securitySchemes:
    oauth:
      type: oauth2
      provider: eventbrite
      flows:
        authorizationCode:
          authorizationUrl: https://www.eventbrite.com/oauth/authorize
          tokenUrl: https://www.eventbrite.com/oauth/token
          scopes: {}
paths:
  /v3/users/me/:
    get:
      operationId: get_me
      summary: Get the authenticated user's profile
      risk: read
      test: true
  /v3/users/me/orders/:
    get:
      operationId: list_my_orders
      # Eventbrite pages every list endpoint in fixed groups of 50 and does not
      # let a caller choose the size, so there is no `page_size` half to
      # declare — the bound is the upstream's. What was missing is the other
      # half: `continuation` was never declared, so a caller could read the
      # first 50 and had no way to ask for the rest.
      pagination:
        next:
          style: cursor
          param: continuation
          from: pagination.continuation
        items: orders
        has_more: pagination.has_more_items
      summary: List orders (registrations) placed by the authenticated user
      risk: read
      parameters:
        - name: continuation
          in: query
          description: >-
            Continuation token from a previous response's
            `pagination.continuation`. Absent from the last page.
          schema:
            type: string
  /v3/users/me/organizations/:
    get:
      operationId: list_organizations
      # Same shape as list_my_orders — a fixed 50 per page, plus a continuation.
      pagination:
        next:
          style: cursor
          param: continuation
          from: pagination.continuation
        items: organizations
        has_more: pagination.has_more_items
      summary: List organizations the user belongs to
      risk: read
      parameters:
        - name: continuation
          in: query
          description: >-
            Continuation token from a previous response's
            `pagination.continuation`. Absent from the last page.
          schema:
            type: string
  /v3/events/{event_id}/:
    get:
      operationId: get_event
      summary: "Get details of event {event_id}"
      risk: read
      scope_param: event_id
      parameters:
        - name: event_id
          in: path
          required: true
          description: The event ID
          schema:
            type: string
  /v3/events/{event_id}/ticket_classes/:
    get:
      operationId: list_ticket_classes
      # Same shape as list_my_orders — a fixed 50 per page, plus a continuation.
      pagination:
        next:
          style: cursor
          param: continuation
          from: pagination.continuation
        items: ticket_classes
        has_more: pagination.has_more_items
      summary: "List ticket types for event {event_id}"
      risk: read
      scope_param: event_id
      parameters:
        - name: event_id
          in: path
          required: true
          description: The event ID
          schema:
            type: string
        - name: continuation
          in: query
          description: >-
            Continuation token from a previous response's
            `pagination.continuation`. Absent from the last page.
          schema:
            type: string
  /v3/events/{event_id}/attendees/:
    get:
      operationId: list_event_attendees
      # The severe one: attendee records are rich objects, and a popular event
      # has thousands. Before this the action read every one of them into a
      # single response — the shape that blew the transport cap on Metabase's
      # `list_cards`. Eventbrite's own 50-per-page is the bound; `continuation`
      # is what makes the rest reachable rather than merely absent.
      pagination:
        next:
          style: cursor
          param: continuation
          from: pagination.continuation
        items: attendees
        has_more: pagination.has_more_items
      summary: "List attendees for event {event_id}[ with status {status}]"
      risk: read
      scope_param: event_id
      parameters:
        - name: event_id
          in: path
          required: true
          description: The event ID
          schema:
            type: string
        - name: continuation
          in: query
          description: >-
            Continuation token from a previous response's
            `pagination.continuation`. Absent from the last page.
          schema:
            type: string
        - name: status
          in: query
          description: "Filter by status: attending, not_attending, etc."
          schema:
            type: string
            enum: [attending, not_attending, unpaid]
