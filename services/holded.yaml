            type: string

  # --- Treasury and accounting ---------------------------------------------
  /api/v2/payments:
    get:
      operationId: list_payments
      summary: List payments
      risk: read
      pagination:
        page_size:
          param: limit
          default: 50
          max: 200
        next:
          style: cursor
          param: cursor
          from: cursor
        items: items
        has_more: has_more
      description: >-
        One page of payments across every document type — the money ledger, as
        opposed to the documents the money was against. Narrow it with
        `document_id` to see what has been collected on one invoice, or with
        `banking_account_id` to see what landed in one account. Requires the
        token's Accounting → read scope.
      parameters:
        - name: document_id
          in: query
          description: Only payments against this document
          schema:
            type: string
        - name: document_type
          in: query
          description: Document type the payment is against (e.g. invoice, purchase)
          schema:
            type: string
        - name: banking_account_id
          in: query
          description: Only payments in this treasury account
          x-overslash-aliases: [treasury_id, bank_account_id]
          schema:
            type: string
        - name: start_date
          in: query
          description: Paid on or after this date
          x-overslash-aliases: [from, since]
          schema:
            type: string
        - name: end_date
          in: query
          description: Paid on or before this date
          x-overslash-aliases: [to, until]
          schema:
            type: string
        - name: cursor
          in: query
          description: Cursor from the previous response's `cursor`
          schema:
            type: string
        - name: limit
          in: query
          description: Payments per page, max 200
          schema:
            type: integer
  /api/v2/treasury/accounts:
    get:
      operationId: list_banking_accounts
      summary: List treasury accounts
      risk: read
      pagination:
        page_size:
          param: limit
          default: 50
          max: 200
        next:
          style: cursor
          param: cursor
          from: cursor
        items: items
        has_more: has_more
      description: >-
        One page of treasury accounts — banks, cards, payment gateways and cash
        boxes. An account's `id` is the `treasury_id` that
        `create_invoice_payment` books a payment to. Requires the token's
        Accounting → read scope.
      parameters:
        - name: type
          in: query
          description: Kind of account
          schema:
            type: string
            enum: [bank, card, gateway, cash]
        - name: archived
          in: query
          description: Include archived accounts
          schema:
            type: boolean
        - name: cursor
          in: query
          description: Cursor from the previous response's `cursor`
          schema:
            type: string
        - name: limit
          in: query
          description: Accounts per page, max 200
          schema:
            type: integer
  /api/v2/treasury/accounts/{id}/bank-movements:
    get:
      operationId: list_bank_movements
      summary: "List movements on treasury account {id}"
      risk: read
      # Scoped per account on purpose: reading one bank account's movements is
      # a narrower grant than reading every account's, and this is the only
      # read here where that distinction is worth drawing.
      scope_param: id
      pagination:
        page_size:
          param: limit
          default: 50
          max: 200
        next:
          style: cursor
          param: cursor
          from: cursor
        items: items
        has_more: has_more
      description: >-
        One page of movements on a treasury account, with their reconciliation
        state. Requires the token's Accounting → read scope.
      parameters:
        - name: id
          in: path
          required: true
          description: Treasury account id (from list_banking_accounts)
          x-overslash-aliases: [banking_account_id, treasury_id, bank_account_id, account_id]
          schema:
            type: string
        - name: status
          in: query
          description: Reconciliation states to include
          schema:
            type: array
            items:
              type: string
        - name: start_date
          in: query
          description: Movements on or after this date
          x-overslash-aliases: [from, since]
          schema:
            type: string
        - name: end_date
          in: query
          description: Movements on or before this date
          x-overslash-aliases: [to, until]
          schema:
            type: string
        - name: cursor
          in: query
          description: Cursor from the previous response's `cursor`
          schema:
            type: string
        - name: limit
          in: query
          description: Movements per page, max 200
          schema:
            type: integer
  /api/v2/ledger-entries:
    get:
      operationId: list_ledger_entries
      summary: List ledger entries
      risk: read
      pagination:
        page_size:
          param: limit
          default: 50
          max: 200
        next:
          style: cursor
          param: cursor
          from: cursor
        items: items
        has_more: has_more
      description: >-
        One page of entries from the daily ledger. Unlike every other list here
        both `start_date` and `end_date` are **required** — the books are not
        something to enumerate unbounded. Narrow further with `account` to see
        one PGC account's movements. Requires the token's Accounting → read
        scope.
      parameters:
        - name: start_date
          in: query
          required: true
          description: Entries from this date onward
          x-overslash-aliases: [from, since]
          schema:
            type: string
        - name: end_date
          in: query
          required: true
          description: Entries up to this date
          x-overslash-aliases: [to, until]
          schema:
            type: string
        - name: account
          in: query
          description: Accounting account number, e.g. 70500001 (from list_accounting_accounts)
          x-overslash-aliases: [account_number, pgc]
          schema:
            type: integer
        - name: cursor
          in: query
          description: Cursor from the previous response's `cursor`
          schema:
            type: string
        - name: limit
          in: query
          description: Entries per page, max 200
          schema:
            type: integer
  /api/v2/payment-methods:
    get:
      operationId: list_payment_methods
      summary: List payment methods
      risk: read
      pagination:
        page_size:
          param: limit
          default: 50
          max: 200
        next:
          style: cursor
          param: cursor
          from: cursor
        items: items
        has_more: has_more
      description: >-
        One page of the account's payment methods. A method's `id` is the
        `payment_method_id` `create_invoice` and `create_purchase` accept. Note
        the scope: this is invoicing settings, under Sales, not Accounting.
        Requires the token's Sales → read scope.
      parameters:
        - name: cursor
          in: query
          description: Cursor from the previous response's `cursor`
          schema:
            type: string
        - name: limit
          in: query
          description: Payment methods per page, max 200
          schema:
            type: integer
  # The three settings lists below take no `cursor` and no `limit` upstream —
  # each is a bounded set that comes back whole. Their action keys are listed in
  # `shipped_list_actions_declare_pagination`'s allow-list for that reason.
  /api/v2/taxes:
    get:
      operationId: list_taxes
      summary: List taxes
      risk: read
      description: >-
        Every tax rate configured on the account, in one response — there is no
        page size and no cursor, because this is a settings list. A tax `id`
        from here is what goes in an invoice line's `taxes` array. Requires the
        token's Accounting → read scope.
  /api/v2/expenses-accounts:
    get:
      operationId: list_expenses_accounts
      summary: List expense accounts
      risk: read
      description: >-
        Every expense account on the account, in one response — no page size and
        no cursor, because this is a settings list. Requires the token's
        Accounting → read scope.
  /api/v2/accounting-accounts:
    get:
      operationId: list_accounting_accounts
      summary: List the chart of accounts
      risk: read
      description: >-
        The account's chart of accounts (PGC), in one response — there is no
        cursor and no page size, so narrow it with `text` rather than paging.
        An account `number` from here is what `list_ledger_entries` takes as
        `account`. Requires the token's Accounting → read scope.
      parameters:
        - name: text
          in: query
          description: Match accounts by name or number
          x-overslash-aliases: [q, query, search, name]
          schema:
            type: string
        - name: archived
          in: query
          description: Include archived accounts
          schema:
            type: boolean
        - name: include_empty
          in: query
          description: Include accounts with no movements
          schema:
            type: boolean
        - name: start_date
          in: query
          description: Compute balances from this date
          x-overslash-aliases: [from, since]
          schema:
            type: string
        - name: end_date
          in: query
          description: Compute balances up to this date
          x-overslash-aliases: [to, until]
          schema:
            type: string
