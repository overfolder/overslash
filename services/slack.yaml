openapi: 3.1.0
info:
  title: Slack
  key: slack
  category: Communication
  description: >
    Slack's Web API (https://api.slack.com/methods), called with a user token
    from the caller's owner `slack` connection, so messages go out as that
    user and reads see what that user sees. Slack's own MCP server is not used:
    it only admits Marketplace-listed or internal apps.
  # Slack reports almost every failure as HTTP 200 with `{"ok": false,
  # "error": "<code>"}`. Without this, a `channel_not_found` would be audited as
  # a success and a paged read would keep walking. The body still reaches the
  # agent unchanged, `error` code included.
  success: ".ok == true"
servers:
  - url: https://slack.com
components:
  securitySchemes:
    oauth:
      type: oauth2
      provider: slack
      flows:
        authorizationCode:
          # The user-token pair (migration 134). On `oauth/v2/authorize`,
          # `scope=` means *bot* scopes, and the token would come back nested
          # under `authed_user`.
          authorizationUrl: https://slack.com/oauth/v2_user/authorize
          tokenUrl: https://slack.com/api/oauth.v2.user.access
          scopes:
            chat:write: Send and edit messages as the user
            channels:read: List public channels
            groups:read: List private channels the user is in
            channels:history: Read public channel messages
            groups:history: Read private channel messages
            users:read: Look up workspace members
            search:read: Search messages
            reactions:write: Add emoji reactions
paths:
  # ── messaging ──────────────────────────────────────────────────────────────
  /api/chat.postMessage:
    post:
      operationId: send_message
      summary: 'Post Slack message "{text}" to {channel}'
      description: >-
        Post a message to a channel, a DM (pass a user ID as `channel`), or a
        thread (pass the parent's `thread_ts`). Text is Slack mrkdwn.
      risk: write
      scope_param: channel
      security:
        - oauth: [chat:write]
      disclose:
        - label: Channel
          filter: .resolved.channel // .body.channel
        - label: Message
          primary: true
          filter: .body.text
          max_chars: 2000
        - label: Thread
          filter: .body.thread_ts // empty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, text]
              properties:
                channel:
                  type: string
                  description: Channel ID (e.g. C0123456789), or a user ID for a DM.
                  resolve:
                    get: /api/conversations.info?channel={channel}
                    display: '#{channel.name}'
                text:
                  type: string
                  minLength: 1
                  description: Message text (Slack mrkdwn).
                thread_ts:
                  type: string
                  description: Parent message `ts`, to reply in its thread.
  /api/chat.update:
    post:
      operationId: update_message
      summary: 'Edit Slack message {ts} in {channel} to "{text}"'
      description: Replace the text of a message the user posted.
      risk: write
      scope_param: channel
      security:
        - oauth: [chat:write]
      disclose:
        - label: Channel
          filter: .resolved.channel // .body.channel
        - label: Message
          filter: .body.ts
        - label: New text
          primary: true
          filter: .body.text
          max_chars: 2000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, ts, text]
              properties:
                channel:
                  type: string
                  description: Channel ID the message is in.
                  resolve:
                    get: /api/conversations.info?channel={channel}
                    display: '#{channel.name}'
                ts:
                  type: string
                  description: The message's `ts`.
                text:
                  type: string
                  minLength: 1
                  description: Replacement text (Slack mrkdwn).
  /api/reactions.add:
    post:
      operationId: add_reaction
      summary: "React :{name}: to Slack message {timestamp} in {channel}"
      description: Add an emoji reaction to a message.
      risk: write
      scope_param: channel
      security:
        - oauth: [reactions:write]
      disclose:
        - label: Reaction
          primary: true
          filter: '":" + .body.name + ":"'
        - label: Channel
          filter: .resolved.channel // .body.channel
        - label: Message
          filter: .body.timestamp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, timestamp, name]
              properties:
                channel:
                  type: string
                  description: Channel ID the message is in.
                  resolve:
                    get: /api/conversations.info?channel={channel}
                    display: '#{channel.name}'
                timestamp:
                  type: string
                  description: The message's `ts`.
                name:
                  type: string
                  description: Emoji name without colons (e.g. `thumbsup`).

  # ── channels ───────────────────────────────────────────────────────────────
  /api/conversations.list:
    get:
      operationId: list_channels
      summary: List Slack channels
      description: >-
        List channels in the workspace. Public channels by default; pass
        `types: public_channel,private_channel` to include private ones.
      risk: read
      test:
        params:
          limit: 1
      security:
        - oauth: [channels:read, groups:read]
      pagination:
        page_size:
          param: limit
          max: 1000
        next:
          style: cursor
          param: cursor
          from: response_metadata.next_cursor
        items: channels
      parameters:
        - name: types
          in: query
          description: Comma-separated channel types (public_channel, private_channel).
          schema:
            type: string
        - name: exclude_archived
          in: query
          schema:
            type: boolean
            default: true
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: cursor
          in: query
          description: Continuation cursor from `response_metadata.next_cursor`.
          schema:
            type: string
  /api/conversations.history:
    get:
      operationId: read_channel_history
      summary: Read recent messages in {channel}
      description: Read a channel's messages, newest first.
      risk: read
      scope_param: channel
      security:
        - oauth: [channels:history, groups:history]
      # conversations.history sends its own `has_more`, which outranks any
      # inference from the row count.
      pagination:
        page_size:
          param: limit
          max: 1000
        next:
          style: cursor
          param: cursor
          from: response_metadata.next_cursor
        items: messages
        has_more: has_more
      parameters:
        - name: channel
          in: query
          required: true
          description: Channel ID.
          schema:
            type: string
            minLength: 1
          resolve:
            get: /api/conversations.info?channel={channel}
            display: '#{channel.name}'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
        - name: oldest
          in: query
          description: Only messages after this Unix `ts`.
          schema:
            type: string
        - name: latest
          in: query
          description: Only messages before this Unix `ts`.
          schema:
            type: string
  /api/conversations.replies:
    get:
      operationId: get_thread_replies
      summary: Read the thread {ts} in {channel}
      description: Read a thread. The parent message comes first.
      risk: read
      scope_param: channel
      security:
        - oauth: [channels:history, groups:history]
      pagination:
        page_size:
          param: limit
          max: 1000
        next:
          style: cursor
          param: cursor
          from: response_metadata.next_cursor
        items: messages
        has_more: has_more
      parameters:
        - name: channel
          in: query
          required: true
          description: Channel ID.
          schema:
            type: string
            minLength: 1
          resolve:
            get: /api/conversations.info?channel={channel}
            display: '#{channel.name}'
        - name: ts
          in: query
          required: true
          description: The parent message's `ts`.
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: cursor
          in: query
          schema:
            type: string

  # ── users ──────────────────────────────────────────────────────────────────
  /api/users.info:
    get:
      operationId: get_user
      summary: Look up the Slack user {user}
      risk: read
      scope_param: user
      security:
        - oauth: [users:read]
      parameters:
        - name: user
          in: query
          required: true
          description: User ID (e.g. U0123456789).
          schema:
            type: string
            minLength: 1
          resolve:
            get: /api/users.info?user={user}
            display: '{user.real_name}[ (@{user.name})]'
  /api/users.list:
    get:
      operationId: list_users
      summary: List Slack workspace members
      risk: read
      security:
        - oauth: [users:read]
      pagination:
        page_size:
          param: limit
          max: 1000
        next:
          style: cursor
          param: cursor
          from: response_metadata.next_cursor
        items: members
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: cursor
          in: query
          schema:
            type: string

  # ── search ─────────────────────────────────────────────────────────────────
  /api/search.messages:
    get:
      operationId: search_messages
      summary: Search Slack messages matching {query}
      risk: read
      security:
        - oauth: [search:read]
      # The one Slack method that pages by ordinal rather than cursor, and it
      # spells the page size `count`. `page` declares `default: 1` because that
      # default is the only place to say Slack counts pages from one.
      pagination:
        page_size:
          param: count
          max: 100
        next:
          style: page
          param: page
        items: messages.matches
      parameters:
        - name: query
          in: query
          required: true
          description: Search query. Slack operators work (e.g. `in:#general from:@me`).
          schema:
            type: string
            minLength: 1
        - name: count
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page
          in: query
          description: 1-based page of results.
          schema:
            type: integer
            minimum: 1
            default: 1
