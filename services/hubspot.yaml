# HubSpot CRM via HubSpot's official remote MCP server
# (https://mcp.hubspot.com), a Streamable-HTTP MCP endpoint that exposes the
# CRM (contacts, companies, deals, tickets, …) and engagements (notes, tasks,
# calls, emails, meetings) as tools.
#
# Auth: HubSpot's remote MCP requires OAuth 2.1 + PKCE against a *custom* OAuth
# client — a "MCP auth app" the operator creates in HubSpot (Development → MCP
# Auth Apps), which issues a client_id/client_secret. Bring that client to
# Overslash as a BYOC credential for the `hubspot` provider; Overslash then
# runs the connect flow and injects the resulting bearer on every tool call.
#
# The tool list below is authored inline (globals ship their tools in-repo).
# It is a curated slice of HubSpot's ~21 remote-MCP tools, enriched with
# Overslash `risk` / `scope_param` / `disclose` fields. `objectType` is the
# scoping param for the generic object tools (values: contacts, companies,
# deals, tickets, line_items, products, quotes, orders, carts, invoices,
# subscriptions, leads, meetings, calls, emails, notes, tasks, users, …).
openapi: 3.1.0
info:
  title: HubSpot
  key: hubspot
  category: CRM
  description: >-
    HubSpot CRM via the official remote MCP server. Read and write contacts,
    companies, deals, and engagements (notes/tasks) through HubSpot's hosted
    MCP tools. Connect with a custom HubSpot OAuth (MCP auth) app.
x-overslash-runtime: mcp
servers: []
paths: {}
x-overslash-mcp:
  url: https://mcp.hubspot.com
  auth:
    kind: oauth
    provider: hubspot
    # Superset of scopes requested at connect time. HubSpot ultimately gates
    # access by the user's own permissions + the tools the app exposes, but
    # these are the CRM read/write scopes the tools below rely on.
    scopes:
      - crm.objects.contacts.read
      - crm.objects.contacts.write
      - crm.objects.companies.read
      - crm.objects.companies.write
      - crm.objects.deals.read
      - crm.objects.deals.write
      - crm.schemas.contacts.read
  autodiscover: false
  tools:
    # ── generic object reads ────────────────────────────────────────────
    - name: hubspot_list_objects
      mcp_tool: hubspot-list-objects
      risk: read
      scope_param: objectType
      description: "List a page of {objectType} records"
      input_schema:
        type: object
        properties:
          objectType:
            type: string
            description: "CRM object type, e.g. `contacts`, `companies`, `deals`, `tickets`."
          limit:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            description: "Records per page (max 100)."
          after:
            type: string
            description: "Paging cursor from the previous response's `paging.next.after`."
          properties:
            type: array
            items:
              type: string
            description: "Property names to return, e.g. [\"email\", \"firstname\"]."
        required: [objectType]

    - name: hubspot_search_objects
      mcp_tool: hubspot-search-objects
      risk: read
      scope_param: objectType
      description: "Search {objectType} records by filters or free text"
      input_schema:
        type: object
        properties:
          objectType:
            type: string
            description: "CRM object type to search."
          query:
            type: string
            description: "Free-text search string."
          filterGroups:
            type: array
            description: >-
              Up to 5 filter groups (OR'd); each has `filters`
              [{propertyName, operator, value}] (AND'd within a group).
            items:
              type: object
          properties:
            type: array
            items:
              type: string
            description: "Property names to return."
          limit:
            type: integer
            minimum: 1
            maximum: 200
            default: 10
            description: "Max results per page (max 200)."
          after:
            type: string
            description: "Paging cursor."
        required: [objectType]

    - name: hubspot_batch_read_objects
      mcp_tool: hubspot-batch-read-objects
      risk: read
      scope_param: objectType
      description: "Read up to 100 {objectType} records by id"
      input_schema:
        type: object
        properties:
          objectType:
            type: string
            description: "CRM object type."
          inputs:
            type: array
            description: "Records to read: [{id}] (or {id, idProperty} to look up by a unique property)."
            items:
              type: object
          properties:
            type: array
            items:
              type: string
            description: "Property names to return."
        required: [objectType, inputs]

    # ── generic object writes ───────────────────────────────────────────
    - name: hubspot_batch_create_objects
      mcp_tool: hubspot-batch-create-objects
      risk: write
      scope_param: objectType
      description: "Create {objectType} records"
      input_schema:
        type: object
        properties:
          objectType:
            type: string
            description: "CRM object type to create."
          inputs:
            type: array
            description: "Records to create: [{properties: {...}, associations?: [...]}]."
            items:
              type: object
        required: [objectType, inputs]
      # MCP-runtime disclosure input is {runtime, tool, arguments, service,
      # action}; filters address `.arguments.*`.
      disclose:
        - label: Object type
          filter: .arguments.objectType
        - label: Count
          filter: '.arguments.inputs | length'
        - label: First email
          filter: '.arguments.inputs[0].properties.email // empty'

    - name: hubspot_batch_update_objects
      mcp_tool: hubspot-batch-update-objects
      risk: write
      scope_param: objectType
      description: "Update {objectType} records by id"
      input_schema:
        type: object
        properties:
          objectType:
            type: string
            description: "CRM object type to update."
          inputs:
            type: array
            description: "Records to update: [{id, properties: {...}}]."
            items:
              type: object
        required: [objectType, inputs]
      disclose:
        - label: Object type
          filter: .arguments.objectType
        - label: Count
          filter: '.arguments.inputs | length'
        - label: Ids
          filter: '[.arguments.inputs[].id] | join(", ")'

    # ── engagements (notes / tasks / calls / emails / meetings) ─────────
    - name: hubspot_create_engagement
      mcp_tool: hubspot-create-engagement
      risk: write
      scope_param: type
      description: "Log a {type} engagement"
      input_schema:
        type: object
        properties:
          type:
            type: string
            enum: [NOTE, TASK, MEETING, CALL, EMAIL]
            description: "Engagement type."
          properties:
            type: object
            description: >-
              Engagement properties, e.g. {\"hs_note_body\": \"Called re: renewal\",
              \"hs_timestamp\": \"2026-07-03T12:00:00Z\"}.
          associations:
            type: array
            description: "Records to associate the engagement with, e.g. a contact/company/deal."
            items:
              type: object
        required: [type, properties]
      disclose:
        - label: Type
          filter: .arguments.type
        - label: Note
          filter: '.arguments.properties.hs_note_body // empty'
          max_chars: 500
        - label: Task
          filter: '.arguments.properties.hs_task_subject // empty'

    - name: hubspot_update_engagement
      mcp_tool: hubspot-update-engagement
      risk: write
      scope_param: engagementId
      description: "Update engagement {engagementId}"
      input_schema:
        type: object
        properties:
          engagementId:
            type: string
            description: "The engagement's object id."
          properties:
            type: object
            description: "Engagement properties to update."
        required: [engagementId, properties]
      disclose:
        - label: Engagement
          filter: .arguments.engagementId
        - label: Updated fields
          filter: '(.arguments.properties // {}) | keys | join(", ") | select(length > 0)'

    - name: hubspot_get_engagement
      mcp_tool: hubspot-get-engagement
      risk: read
      scope_param: engagementId
      description: "Get engagement {engagementId}"
      input_schema:
        type: object
        properties:
          engagementId:
            type: string
            description: "The engagement's object id."
        required: [engagementId]

    # ── associations, properties, schema, identity ─────────────────────
    - name: hubspot_list_associations
      mcp_tool: hubspot-list-associations
      risk: read
      scope_param: objectType
      description: "List records associated with a {objectType} record"
      input_schema:
        type: object
        properties:
          objectType:
            type: string
            description: "Source CRM object type."
          objectId:
            type: string
            description: "Source record id."
          toObjectType:
            type: string
            description: "Associated object type to return, e.g. `companies`."
        required: [objectType, objectId, toObjectType]

    - name: hubspot_list_properties
      mcp_tool: hubspot-list-properties
      risk: read
      scope_param: objectType
      description: "List the defined properties for {objectType}"
      input_schema:
        type: object
        properties:
          objectType:
            type: string
            description: "CRM object type."
        required: [objectType]

    - name: hubspot_get_schemas
      mcp_tool: hubspot-get-schemas
      risk: read
      description: "List custom object schemas (and their objectType ids)"
      input_schema:
        type: object
        properties: {}
        required: []

    - name: hubspot_get_user_details
      mcp_tool: hubspot-get-user-details
      risk: read
      description: "Get the authenticated user, hub id, and granted scopes"
      input_schema:
        type: object
        properties: {}
        required: []
