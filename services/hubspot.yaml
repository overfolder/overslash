# HubSpot CRM via HubSpot's official remote MCP server
# (https://mcp.hubspot.com), a Streamable-HTTP MCP endpoint that exposes the
# CRM (contacts, companies, deals, tickets, …), analytics, and property
# metadata as tools.
#
# Auth: HubSpot's remote MCP requires OAuth 2.1 + PKCE against a *custom* OAuth
# client — a "MCP auth app" the operator creates in HubSpot (Development → MCP
# Auth Apps), which issues a client_id/client_secret. Bring that client to
# Overslash as a BYOC credential for the `hubspot` provider; Overslash then
# runs the connect flow and injects the resulting bearer on every tool call.
#
# The tool list below is authored inline (globals ship their tools in-repo)
# and mirrors the live catalog served by mcp.hubspot.com as of 2026-07-05
# (17 tools; verified via tools/list). HubSpot REPLACED its original
# `hubspot-list-objects`-style catalog with this one — calling a retired name
# returns JSON-RPC -32603 "Unknown tool". If calls start failing that way
# again, re-run tools/list and re-sync this file. Connector-internal tools
# (submit_feedback, render_landing_page_ui) and the landing-page CMS editor
# (manage_landing_page) are intentionally not exposed.
openapi: 3.1.0
info:
  title: HubSpot
  key: hubspot
  category: CRM
  description: >-
    HubSpot CRM via the official remote MCP server. Search, read, and write
    contacts, companies, deals, and tickets, query CRM data with SQL, and pull
    campaign/content analytics through HubSpot's hosted MCP tools. Connect
    with a custom HubSpot OAuth (MCP auth) app.
x-overslash-runtime: mcp
servers: []
paths: {}
x-overslash-mcp:
  url: https://mcp.hubspot.com
  auth:
    kind: oauth
    provider: hubspot
    # Scopes requested at connect time. HubSpot's authorize endpoint rejects
    # scopes the operator's MCP auth app doesn't have configured, so this
    # stays a conservative CRM core; the token HubSpot actually issues carries
    # the app's full configured scope set regardless (the token response omits
    # `scope`, so Overslash records this requested set per RFC 6749 §5.1).
    scopes:
      - crm.objects.contacts.read
      - crm.objects.contacts.write
      - crm.objects.companies.read
      - crm.objects.companies.write
      - crm.objects.deals.read
      - crm.objects.deals.write
      - crm.schemas.contacts.read
  autodiscover: false
  tools:
    # ── identity & org (read) — HubSpot recommends get_user_details before
    #    any other tool: it reports which objects/tools this hub can use. ──
    - name: get_user_details
      risk: read
      test: true
      description: "Get the connected HubSpot user, hub, and tool availability"
      input_schema:
        type: object
        properties:
          include:
            type: array
            items:
              type: string
            description: >-
              Optional sections to include, e.g. USER_INFORMATION. Omit for
              the default summary.
        required: []

    - name: get_organization_details
      risk: read
      description: "Get organization teams, roles, seats, and account settings"
      input_schema:
        type: object
        properties:
          include:
            type: array
            items:
              type: string
            description: >-
              Optional sections to include: TEAMS, SEATS, … Omit to return
              the default account summary.
        required: []

    # ── CRM object reads ────────────────────────────────────────────────
    - name: search_crm_objects
      risk: read
      scope_param: objectType
      # `limit` already declares `default: 100`, so the block names it and
      # restates nothing. The paths address the tool's own payload — HubSpot's
      # MCP server answers `{results, total, offset}` — not the gateway's
      # envelope, which is unwrapped first (D55's projection).
      pagination:
        page_size:
          param: limit
          max: 200
        next:
          style: offset
          param: offset
        items: results
      description: "Search {objectType} records by filters or free text"
      input_schema:
        type: object
        properties:
          objectType:
            type: string
            description: "CRM object type, e.g. `contacts`, `companies`, `deals`, `tickets`."
          query:
            type: string
            description: "Free-text search within the object type's default searchable properties."
          filterGroups:
            type: array
            description: >-
              Filter groups, OR'd together. Max 5 groups, 6 filters each, 18
              filters total.
            items:
              type: object
              properties:
                filters:
                  type: array
                  description: >-
                    Property conditions, AND'd within the group.
                  items:
                    type: object
                    required: [propertyName, operator]
                    properties:
                      propertyName:
                        type: string
                        description: >-
                          CRM property to filter on. Not the pseudo-properties
                          `associations.{type}` / `associated_{type}` — use
                          `associatedWith` for those.
                      operator:
                        type: string
                        enum:
                          - EQ
                          - NEQ
                          - LT
                          - LTE
                          - GT
                          - GTE
                          - BETWEEN
                          - IN
                          - NOT_IN
                          - HAS_PROPERTY
                          - NOT_HAS_PROPERTY
                          - CONTAINS_TOKEN
                          - NOT_CONTAINS_TOKEN
                        description: >-
                          HAS_PROPERTY and NOT_HAS_PROPERTY take no value.
                      value:
                        type: string
                        description: "Single-value operators (EQ, NEQ, LT, LTE, GT, GTE, CONTAINS_TOKEN, NOT_CONTAINS_TOKEN)."
                      values:
                        type: array
                        items:
                          type: string
                        description: "Multi-value operators (IN, NOT_IN)."
                      highValue:
                        type: string
                        description: "Upper bound for BETWEEN."
                associatedWith:
                  type: array
                  description: >-
                    Association conditions, AND'd with each other and with
                    `filters` in the same group — "contacts for company X".
                  items:
                    type: object
                    required: [objectType, operator]
                    properties:
                      objectType:
                        type: string
                        description: "Object type to find associations with, e.g. `companies`."
                      operator:
                        type: string
                        enum: [EQUAL, IN, NOT_EQUAL, NOT_IN]
                      objectIdValues:
                        type: array
                        items:
                          type: integer
                        description: >-
                          1-100 ids. Exactly one for EQUAL/NOT_EQUAL, several
                          for IN/NOT_IN.
          properties:
            type: array
            items:
              type: string
            description: "Property names to return, e.g. [\"email\", \"firstname\"]."
          sorts:
            type: array
            description: "Sorting rules (only one may be applied)."
            items:
              type: object
              required: [propertyName, direction]
              properties:
                propertyName:
                  type: string
                direction:
                  type: string
                  enum: [ASCENDING, DESCENDING]
          limit:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
            description: "Max results per page (max 200)."
          offset:
            type: integer
            description: "Paging cursor token from the previous response."
        required: [objectType]

    - name: get_crm_objects
      risk: read
      scope_param: objectType
      # No `pagination:` block: a batch read by id, bounded by `objectIds`
      # (1-100), not a collection with a page to be on. `search_crm_objects`
      # is the paged way to enumerate records.
      description: >-
        Read up to 100 {objectType} records by id. Bounded by the ids you
        pass, so there is nothing to page — use search_crm_objects to
        enumerate records.
      input_schema:
        type: object
        properties:
          objectType:
            type: string
            description: "CRM object type to fetch."
          objectIds:
            type: array
            items:
              type: string
            description: "Object IDs to fetch (1–100)."
          properties:
            type: array
            items:
              type: string
            description: "Property names to return."
        required: [objectType]

    - name: query_crm_data
      risk: read
      # No `pagination:` block: the page lives in the SQL the caller writes.
      description: >-
        Query CRM data with SQL. There is no page-size argument — bound the
        result with LIMIT (and walk it with OFFSET) inside the query itself,
        or the whole result set comes back in one response.
      input_schema:
        type: object
        properties:
          sql:
            type: string
            description: >-
              SQL query to run against HubSpot CRM data (HubSpot-specific
              dialect). Call `tool_guidance` for `query_crm_data` before the
              first query — HubSpot requires it and it documents the dialect.
          verbosityLevel:
            type: string
            enum: [LOW, MEDIUM, HIGH]
            description: "LOW: data only; MEDIUM/HIGH: adds citation links."
        required: [sql]

    # ── property metadata (read) ────────────────────────────────────────
    - name: get_properties
      risk: read
      scope_param: objectType
      # No `pagination:` block: property definitions are schema, a bounded
      # set per object type, and HubSpot offers no page size for them.
      description: >-
        Get property definitions for {objectType}. Returns the whole set in
        one response; pass propertyNames to narrow it, or use
        search_properties to find the relevant few by keyword.
      input_schema:
        type: object
        properties:
          objectType:
            type: string
            description: "CRM object type, e.g. contacts, companies, deals, tickets."
          propertyNames:
            type: array
            items:
              type: string
            description: "Specific property names to retrieve; omit for all."
        required: [objectType]

    - name: search_properties
      risk: read
      scope_param: objectType
      # No `pagination:` block: HubSpot exposes no page size here. The
      # keywords are the bound.
      description: >-
        Find relevant {objectType} property definitions by keyword. Returns
        every match in one response; the keywords are the only bound, so pass
        them rather than listing all definitions.
      input_schema:
        type: object
        properties:
          objectType:
            type: string
            description: "CRM object type to search properties for."
          keywords:
            type: array
            items:
              type: string
            description: "Up to 5 keywords; omit to list all property definitions."
        required: [objectType]

    - name: search_owners
      risk: read
      # Answers `{owners, hasMore, offset}`, so the last page is stated by the
      # upstream rather than inferred from the row count.
      pagination:
        page_size:
          param: limit
          max: 100
        next:
          style: offset
          param: offset
        items: owners
        has_more: hasMore
      description: "List or search owners assignable to CRM records"
      input_schema:
        type: object
        properties:
          searchQuery:
            type: string
            description: "Find owners by name or email; omit to list all."
          ownerIds:
            type: array
            items:
              type: string
            description: "Owner IDs to look up directly (search query is then ignored)."
          limit:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
            description: "Max results (max 100)."
          offset:
            type: integer
            description: "Pagination offset."
        required: []

    # ── campaign & content analytics (read) ─────────────────────────────
    - name: get_campaign_analytics
      risk: read
      # No `pagination:` block: bounded by `requests` (max 20), which is a
      # batch size rather than a page.
      description: >-
        Get engagement analytics for campaigns. Bounded by the requests you
        pass (max 20), so there is nothing to page.
      input_schema:
        type: object
        properties:
          requests:
            type: array
            description: >-
              Analytics requests to process (max 20), each a full
              CampaignAnalyticsRequest.
            items:
              type: object
        required: [requests]

    - name: get_campaign_contacts_by_type
      risk: read
      # `offset` is documented zero-based, which is what the `offset` style
      # assumes. No `items`: the shape of this tool's result is HubSpot's to
      # decide and is not verified here, and a path that names nothing is a
      # claim about the template rather than the collection. The cost of
      # leaving it out is one empty call at the end of a traversal — the
      # cheaper mistake than stopping a page early.
      pagination:
        page_size:
          param: limit
          max: 500
        next:
          style: offset
          param: offset
      description: "Get contact IDs for a campaign by attribution type"
      input_schema:
        type: object
        properties:
          campaignCrmObjectId:
            type: integer
            description: "The campaign's numeric CRM object ID (hs_object_id)."
          contactType:
            type: string
            enum: [NEW_CONTACTS_FIRST_TOUCH, NEW_CONTACTS_LAST_TOUCH, INFLUENCED_CONTACTS]
            description: "Contact attribution type."
          startDate:
            type: string
            description: "Optional range start (YYYY-MM-DD); provide with endDate."
          endDate:
            type: string
            description: "Optional range end (YYYY-MM-DD); provide with startDate."
          limit:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
            description: "Contacts per page (max 500)."
          offset:
            type: integer
            description: "Zero-based pagination offset."
        required: [campaignCrmObjectId, contactType]

    - name: get_campaign_asset_metrics
      risk: read
      # No `pagination:` block: HubSpot exposes no page size or offset for
      # this tool. `crmObjectIds` is the only bound available.
      description: >-
        Get metrics for a campaign's associated assets. HubSpot offers no
        page size here, so a campaign with many assets returns them all in
        one response — pass crmObjectIds to scope it.
      input_schema:
        type: object
        properties:
          campaignCrmObjectId:
            type: integer
            description: "The campaign's numeric CRM object ID (hs_object_id)."
          assetType:
            type: string
            description: "Asset type, e.g. LANDING_PAGE, SITE_PAGE, BLOG_POST, MEETING_EVENT."
          crmObjectIds:
            type: array
            items:
              type: string
            description: "Optional asset IDs to scope to; omit for all assets of the type."
          startDate:
            type: string
            description: "Optional range start (YYYY-MM-DD); provide with endDate."
          endDate:
            type: string
            description: "Optional range end (YYYY-MM-DD); provide with startDate."
        required: [campaignCrmObjectId, assetType]

    - name: get_content_analytics_report
      risk: read
      # The one HubSpot tool whose `limit` declares no default of its own, so
      # this is the one where `page_size.default` actually seeds something —
      # without it, omitting `limit` left the row count to HubSpot. No
      # `items`, for the reason given on get_campaign_contacts_by_type.
      pagination:
        page_size:
          param: limit
          default: 100
        next:
          style: offset
          param: offset
      description: "Run a content analytics report ({mode})"
      input_schema:
        type: object
        properties:
          mode:
            type: string
            enum: [TOTALS, TIME_SERIES, SUMMARY, PEOPLE]
            description: "Report mode."
          contentIds:
            type: array
            items:
              type: string
            description: "Content IDs to filter to; empty for all content."
          start:
            type: string
            description: "Window start (ISO 8601); defaults to last 30 days."
          end:
            type: string
            description: "Window end (ISO 8601); defaults to today."
          period:
            type: string
            enum: [DAILY, WEEKLY, MONTHLY, QUARTERLY, YEARLY]
            description: "Bucket size — required for TIME_SERIES/SUMMARY modes."
          peopleType:
            type: string
            enum: [CONTACTS, VISITORS]
            description: "Required for PEOPLE mode."
          search:
            type: string
            description: "Free-text filter on content title or URL."
          limit:
            type: integer
            description: "Max rows (default 100)."
          offset:
            type: integer
            description: "Row offset for pagination."
        required: [mode]

    # ── CRM object writes ───────────────────────────────────────────────
    - name: manage_crm_objects
      risk: write
      description: "Create or update CRM records"
      input_schema:
        type: object
        properties:
          createRequest:
            type: object
            description: >-
              Create payload. Provide exactly one of createRequest /
              updateRequest. Max 10 objects per request.
            properties:
              objects:
                type: array
                items:
                  type: object
                  required: [objectType]
                  properties:
                    objectType:
                      type: string
                      description: >-
                        Object type to create, e.g. `contacts`, `companies`,
                        `deals`, `tickets`. For anything that is not a
                        well-known standard type, resolve the exact typeName
                        with `discover_hubspot_schema` first — creating the
                        wrong object type cannot be undone.
                    properties:
                      type: object
                      additionalProperties: true
                      description: >-
                        Property keys and values to set. Free-form: the keys
                        are this portal's property names, so check them with
                        `search_properties`. `hubspot_owner_id` defaults to
                        the connected user when omitted; pass an empty string
                        to leave the record unowned.
                    associations:
                      type: array
                      description: >-
                        Records to associate once this one is created.
                      items:
                        type: object
                        required: [targetObjectId, targetObjectType]
                        properties:
                          targetObjectId:
                            type: integer
                          targetObjectType:
                            type: string
                            description: "e.g. CONTACT, COMPANY, DEAL."
                          labels:
                            type: array
                            items:
                              type: string
                            description: >-
                              Association labels to add, e.g. "Billing
                              Contact". They must already exist for this
                              object-type pair; listed labels are added to any
                              already on the association.
          updateRequest:
            type: object
            description: >-
              Update payload. Provide exactly one of createRequest /
              updateRequest. Max 10 objects per request. Also the way to
              associate two records that both already exist.
            properties:
              objects:
                type: array
                items:
                  type: object
                  required: [objectType, objectId]
                  properties:
                    objectType:
                      type: string
                    objectId:
                      type: integer
                    properties:
                      type: object
                      additionalProperties: true
                      description: >-
                        Property keys and values to update. Not every property
                        is editable — sample the record first. Leave empty to
                        only create associations.
                    associations:
                      type: array
                      items:
                        type: object
                        required: [targetObjectId, targetObjectType]
                        properties:
                          targetObjectId:
                            type: integer
                          targetObjectType:
                            type: string
                          labels:
                            type: array
                            items:
                              type: string
          confirmationStatus:
            type: string
            enum: [CONFIRMED, CONFIRMATION_WAIVED_FOR_SESSION]
            description: >-
              HubSpot-side confirmation flag. Overslash's own permission chain
              and human approvals gate this action; pass CONFIRMED once the
              Overslash approval (if any) has resolved.
        required: []
      # MCP-runtime disclosure input is {runtime, tool, arguments, resolved,
      # service, action}; filters address `.arguments.*`, or `.resolved.*` when
      # a param declares a resolver. The payload is disclosed whole (truncated)
      # rather than field by field: the property map inside it is free-form, so
      # there is no fixed set of paths a filter could name, and a reviewer
      # signing off on a write needs to see what is actually being written.
      disclose:
        - label: Operation
          filter: >-
            [(.arguments.createRequest | if . then "create" else empty end),
             (.arguments.updateRequest | if . then "update" else empty end)]
            | join("+")
        - label: Object type
          # The object type sits on each object, not on the request — so this
          # collects the distinct types across the batch rather than reading a
          # key that is never there. A null branch contributes nothing, which
          # is how "exactly one of createRequest/updateRequest" is handled
          # without naming which one arrived.
          filter: >-
            [(.arguments.createRequest, .arguments.updateRequest)
             | .objects[]? | .objectType]
            | unique | join(", ")
        - label: Payload
          filter: '(.arguments.createRequest // .arguments.updateRequest // empty) | tojson'
          max_chars: 1000

    # ── meta ────────────────────────────────────────────────────────────
    - name: tool_guidance
      risk: read
      description: "Get HubSpot's usage guidance for specific tools"
      input_schema:
        type: object
        properties:
          toolNames:
            type: array
            items:
              type: string
            description: "Tool names to get usage instructions for (e.g. query_crm_data)."
        required: [toolNames]
