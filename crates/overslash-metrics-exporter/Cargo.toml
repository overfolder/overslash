[package]
name = "overslash-metrics-exporter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cloud Run Job: queries Postgres and pushes Overslash business metrics to Google Cloud Monitoring"

[[bin]]
name = "overslash-metrics-exporter"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# A manifest cannot both inherit `[workspace.lints]` and override it, and
# inheriting is what keeps a future workspace lint from silently skipping
# this crate — so the `unsafe_code = "forbid"` that used to live here is
# now `#![forbid(unsafe_code)]` at the crate root.
[lints]
workspace = true
