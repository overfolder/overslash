[package]
name = "overslash-db"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# No `embeddings`: the metrics exporter links this crate, and fastembed/ORT
# would pull ONNX Runtime into its image. The binaries that embed turn it on.
overslash-core = { path = "../overslash-core", default-features = false, features = ["yaml"] }
sqlx = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
pgvector = { version = "0.4", features = ["sqlx"] }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
