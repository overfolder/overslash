[package]
name = "overslash-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# The 100+ files in tests/ are modules of one binary (tests/api.rs), not test
# targets of their own — see the module docs there. Auto-discovery would go
# back to one target per file, so it stays off.
autotests = false

[[test]]
name = "api"
path = "tests/api.rs"

[features]
default = ["embeddings"]
# Propagates to overslash-core; when off, `init_embeddings` short-circuits
# to `DisabledEmbedder` and the search endpoint runs keyword+fuzzy only.
embeddings = ["overslash-core/embeddings"]
# D42 SQL content policy — propagates to overslash-core. When off,
# `sql_policy::analyze` fails closed: every sql-annotated call classifies
# as a write on unknown tables and routes to approval.
sql_policy = ["overslash-core/sql_policy"]

[dependencies]
overslash-core = { path = "../overslash-core", default-features = false, features = ["yaml"] }
overslash-db = { path = "../overslash-db" }
overslash-metrics = { path = "../overslash-metrics" }
metrics = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
rand = { workspace = true }
argon2 = "0.5"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
subtle = { workspace = true }
url = { workspace = true }
urlencoding = "2"
regex = { workspace = true }
base64 = "0.23"
jsonwebtoken = { workspace = true }
futures-util = "0.3"
redis = { workspace = true }
dashmap = { workspace = true }
jaq-core = "=3.1.0"
jaq-std = "=3.0.1"
jaq-json = { version = "=2.0.1", features = ["serde"] }

[dev-dependencies]
overslash-fakes = { path = "../overslash-fakes" }
sqlx = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
libc = "0.2"
minijinja = { version = "2", default-features = false, features = ["serde"] }
