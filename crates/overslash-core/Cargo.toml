[package]
name = "overslash-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["yaml", "embeddings"]
# Enables YAML parsing support in the registry loader and the template
# validator's YAML entry point. Disable for WASM builds that only need to
# validate pre-parsed (JSON / struct) template definitions.
yaml = ["dep:serde_yaml"]
# Enables the local fastembed backend for semantic search. Off for library
# consumers that only want keyword + fuzzy (or who provide their own
# Embedder impl). The binary targets (overslash-api/-cli) keep this on.
embeddings = ["dep:fastembed"]
# D42 SQL content policy: Postgres-exact parse of SQL-bearing action params
# via pg_query (Rust bindings over libpg_query, Postgres's own C parser).
# Off by default — it adds a C-toolchain build dependency and binary weight
# that the default build and CI must not pay. Compiled out, `sql_policy::
# analyze` fails closed (everything classifies as a write on unknown tables).
# Every shipping build opts in — see the feature comment in
# crates/overslash-cli/Cargo.toml for the full list of places that must.
sql_policy = ["dep:pg_query"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
aes-gcm = "0.11"
base64 = "0.23"
glob-match = "0.2"
# Lexer + parser only: credential templates are analysed at compile time to
# learn which secret slots they read. Evaluation (jaq-std/jaq-json) stays in
# overslash-api so core never runs a jq program.
jaq-core = "=3.1.0"
serde_yaml = { version = "0.9", optional = true }
tracing = { workspace = true }
async-trait = { workspace = true }
strsim = "0.11"
fastembed = { version = "6", optional = true }
# Builds vendored libpg_query (C toolchain + libclang for bindgen). Kept
# behind `sql_policy` so the default build never pays for it.
pg_query = { version = "6", optional = true }

[dev-dependencies]
tempfile = "3"
