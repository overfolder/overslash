<!doctype html>
<html>
  <body style="margin: 0; padding: 0; background: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: #383a42;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background: #f5f5f7;">
      <tr>
        <td align="center" style="padding: 40px 16px;">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="max-width: 560px; background: #ffffff; border: 1px solid #e8e8ee; border-radius: 12px;">
            <tr>
              <td style="padding: 32px 32px 8px 32px;">
                <div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #737580;">Overslash</div>
                <h1 style="margin: 12px 0 0 0; font-size: 22px; line-height: 1.3; color: #17191c;">Sign in to Overslash.</h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 32px 8px 32px; font-size: 15px; line-height: 1.55;">
                <p style="margin: 0 0 14px 0;">Click the button below to sign in. This link expires in 15 minutes and can only be used once.</p>
              </td>
            </tr>
            <tr>
              <td style="padding: 8px 32px 24px 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="background: #6359d9; border-radius: 8px;">
                      <a href="{verify_url}" style="display: inline-block; padding: 11px 20px; font-size: 14px; font-weight: 600; color: #ffffff; text-decoration: none;">Sign in to Overslash</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 28px 32px; font-size: 13px; color: #737580; line-height: 1.5; border-top: 1px solid #f5f5f7;">
                <p style="margin: 18px 0 0 0;">Didn't request this? You can safely ignore this email — no one can sign in without clicking the link above.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
